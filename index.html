<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mini Golf Scorecard</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101412">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%B3%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f7f5; --card: #ffffff; --fg: #14201a; --muted: #5a6a61; --line: #d6ded9;
    --accent: #1f7a4d; --accent-fg: #ffffff; --soft: #e6f1ea;
    --error: #b3261e; --amber: #e8a317;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101412; --card: #18201c; --fg: #e8efea; --muted: #9fb0a6; --line: #2d3a33;
      --accent: #4cc68a; --accent-fg: #0b1510; --soft: #1b3026;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    background: var(--bg); color: var(--fg);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; touch-action: manipulation;
  }
  .wrap {
    max-width: 520px; margin: 0 auto; box-sizing: border-box;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  h1 { font-size: 1.6rem; margin: 0; }
  h2 { font-size: 1.3rem; margin: 0 0 8px; }
  p { margin: 8px 0; }
  .top { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; flex-wrap: wrap; }
  .top .link { padding-left: 0; }
  .hint { color: var(--muted); font-size: .95rem; }
  .sub { display: block; font-size: .95rem; font-weight: 400; opacity: .9; margin-top: 2px; }
  .eyebrow { color: var(--muted); font-size: .9rem; margin: 0 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  .section-label { color: var(--muted); font-size: .9rem; margin: 20px 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
  .error { color: var(--error); font-weight: 600; }

  .btn {
    font: inherit; font-size: 18px; font-weight: 600; min-height: 56px; padding: 0 20px;
    border-radius: 14px; border: 2px solid var(--accent); background: var(--card); color: var(--accent);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.big { width: 100%; min-height: 72px; font-size: 22px; flex-direction: column; margin: 8px 0; }
  .btn.small { min-height: 44px; font-size: 16px; padding: 0 14px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .link {
    background: none; border: 0; color: var(--accent); font: inherit; font-size: 16px;
    min-height: 44px; padding: 10px 8px; cursor: pointer; text-decoration: underline;
  }
  .link.danger { color: var(--error); }

  .text {
    font: inherit; font-size: 18px; min-height: 52px; padding: 0 14px; flex: 1; min-width: 0;
    border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .add, .rename { display: flex; gap: 8px; align-items: center; margin: 8px 0; }

  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 4px; min-height: 56px; border-bottom: 1px solid var(--line); }
  .row .rename { margin: 8px 0; width: 100%; }
  .pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 56px; font-size: 19px; cursor: pointer; }
  .pick input { width: 26px; height: 26px; margin: 0; flex: none; accent-color: var(--accent); }
  .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }

  .playing {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    margin: 12px 0 4px; min-height: 52px; padding: 10px 14px; border-radius: 12px;
    background: var(--soft); color: var(--fg); border: 0; font: inherit; font-size: 17px; text-align: left; cursor: pointer;
  }
  .links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 16px; }
  .banner-order { font-size: 1.35rem; font-weight: 700; margin: 8px 0 12px; }

  .save-banner {
    position: sticky; top: 0; z-index: 5; background: var(--error); color: #ffffff;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; font-weight: 600;
  }
  .save-banner .btn { min-height: 44px; border-color: #ffffff; color: #ffffff; background: transparent; }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    margin: 0 auto; max-width: 480px; z-index: 10; padding: 12px 16px; border-radius: 12px;
    background: var(--fg); color: var(--bg); text-align: center; font-weight: 600;
    pointer-events: none;
  }

  /* ---- scoring screen (spec 4, 6.1) ---- */
  .scoring { --pc: var(--accent); --pi: var(--accent-fg); padding-bottom: calc(var(--dock-h, 300px) + 12px); }
  .banner-first {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: var(--soft); border-radius: 12px; padding: 8px 12px; margin: 4px 0 10px; font-size: 16px;
  }
  .banner-first .link { min-height: 40px; padding: 0 4px; }
  .now {
    position: sticky; top: 0; z-index: 4; background: var(--pc); color: var(--pi);
    border-radius: 14px; padding: 10px 14px; margin: 0 0 12px; box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
  }
  .now .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 600; }
  .now .meta.next { justify-content: flex-end; font-weight: 500; opacity: .92; font-size: 14px; }
  .now .who { font-size: 30px; font-weight: 800; line-height: 1.15; margin: 4px 0; overflow-wrap: anywhere; }
  /* overflow: clip (not hidden) so the sticky header inside still sticks to the viewport */
  .course { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 0 0 12px; overflow: clip; }
  .course-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 44px;
    font: inherit; font-size: 16px; font-weight: 700; color: var(--fg); text-align: left;
    background: color-mix(in srgb, var(--fg) 8%, var(--card)); border: 0; padding: 8px 12px; cursor: pointer;
  }
  .course-head.static { cursor: default; }
  .course-head span:last-child { color: var(--muted); font-size: 14px; font-weight: 600; }
  .sheet { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 17px; font-variant-numeric: tabular-nums; }
  .sheet th, .sheet td { border-top: 1px solid var(--line); padding: 6px 2px; text-align: center; overflow: hidden; }
  .sheet thead th {
    font-size: 13px; font-weight: 600; color: var(--muted); padding: 6px 2px 4px; vertical-align: bottom;
    /* the names row stays under the now-up bar while the card scrolls (--bar-h is set by JS) */
    position: sticky; top: var(--bar-h, 0px); z-index: 3; background: var(--card);
  }
  .sheet thead th:first-child, .sheet tbody th, .sheet tfoot th { width: 48px; color: var(--muted); font-weight: 600; font-size: 14px; }
  .sheet td { height: 40px; }
  .sheet tfoot th, .sheet tfoot td { font-weight: 800; color: var(--fg); border-top: 2px solid var(--line); }
  .sheet .pn { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); font-size: 15px; font-weight: 700; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%;
    background: var(--fg); color: var(--bg); font-size: 11px; font-weight: 800; margin-bottom: 2px;
  }
  .sheet tr.now-row th, .sheet tr.now-row td { background: color-mix(in srgb, var(--pc) 16%, transparent); }
  .sheet td.cur { outline: 2px solid var(--pc); outline-offset: -2px; font-weight: 800; background: color-mix(in srgb, var(--pc) 28%, transparent); }
  .sheet td[data-cell] { cursor: pointer; }
  .sheet td.editing { outline: 3px solid var(--amber); outline-offset: -3px; font-weight: 800; background: color-mix(in srgb, var(--amber) 28%, transparent); }
  .now.editing { background: var(--amber); color: #14201a; cursor: pointer; }
  .now.editing .who { font-size: 26px; }
  .dock {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 6;
    width: 100%; max-width: 520px; background: var(--bg); border-top: 1px solid var(--line);
    box-shadow: 0 -4px 14px rgba(0, 0, 0, .10);
    padding: 8px max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key {
    min-height: 64px; border: 0; border-radius: 12px; background: var(--pc); color: var(--pi);
    font: inherit; font-size: 26px; font-weight: 800; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .key.s { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--pi) 50%, transparent); }
  .tools { display: flex; gap: 8px; margin-top: 8px; }
  .tool {
    flex: 1; min-height: 44px; font: inherit; font-size: 16px; color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
  }
  .tool:disabled { opacity: .45; cursor: default; }
  .tool.menu-btn { flex: 0 0 64px; font-size: 22px; }
  .menu { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }

  /* playoffs (spec 7.1): purple is never a player color */
  .now.playoff { --pc: #5b2a86; --pi: #ffffff; }
  .now.review { --pc: var(--accent); --pi: var(--accent-fg); cursor: pointer; }
  .now.neutral { --pc: #4a5a52; --pi: #ffffff; }
  .sheet tfoot tr.po th, .sheet tfoot tr.po td { font-weight: 600; border-top: 1px solid var(--line); }
  .sheet tfoot tr.po th { font-size: 12px; white-space: nowrap; }
  .sheet tfoot tr.po td { font-size: 16px; }
  .sheet td.out { color: var(--muted); opacity: .45; background: color-mix(in srgb, var(--fg) 7%, transparent); }
  .sheet tfoot tr.po td.cur { font-weight: 800; }

  /* skip decision (spec 7.2): replaces the numpad */
  .skip-sheet { display: flex; flex-direction: column; gap: 8px; }
  .skip-sheet h2 { font-size: 1.1rem; margin: 0; }
  .skip-list { list-style: none; margin: 0; padding: 0; font-size: 16px; }
  .skip-list li { padding: 2px 0; }
  .skip-sheet .btn.big { margin: 0; min-height: 60px; font-size: 19px; }
  body.scoring .toast { bottom: calc(var(--dock-h, 300px) + 12px); }

  /* the confirmation for a tap shows in the now-up bar's last line (never over a cell) */
  .now [data-flash].flash {
    background: color-mix(in srgb, var(--pi) 24%, transparent); border-radius: 999px;
    padding: 1px 10px; font-weight: 800;
  }

  /* ---- stats (spec 8) ---- */
  .stats-head { display: flex; flex-direction: column; gap: 4px; }
  .champ { font-size: 1.2rem; font-weight: 800; margin: 2px 0 4px; }
  .standing { border-top: 1px solid var(--line); padding: 10px 0; }
  .standing:first-child { border-top: 0; padding-top: 4px; }
  .standing .top-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 17px; font-weight: 700; }
  .standing .top-line span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .note { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
  .quiet { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .record {
    display: block; margin: 8px 0 0; padding: 8px 12px; border-radius: 12px;
    background: var(--soft); color: var(--fg); font-weight: 700;
  }
  .highlights { list-style: none; margin: 10px 0 0; padding: 0; font-size: 15px; }
  .highlights li { padding: 3px 0; }
  .list-reset { list-style: none; margin: 0; padding: 0; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
  .actions .btn.big { margin: 0; }
  .btn .sub { font-size: 13px; font-weight: 500; opacity: .8; }

  .confetti-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 20; }
  .confetti {
    position: absolute; top: -14px; width: 8px; height: 12px; border-radius: 2px;
    animation-name: confetti-fall; animation-timing-function: ease-in; animation-fill-mode: forwards;
  }
  @keyframes confetti-fall {
    to { transform: translate3d(var(--dx, 0px), 110vh, 0) rotate(var(--rot, 540deg)); }
  }
  @media (prefers-reduced-motion: reduce) { .confetti-layer { display: none; } }

  /* ---- history (spec 8.3) ---- */
  .tabs { display: flex; gap: 8px; margin: 8px 0 12px; }
  .tab {
    flex: 1; min-height: 48px; font: inherit; font-size: 17px; font-weight: 600; color: var(--fg);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .game-row {
    display: flex; flex-direction: column; gap: 2px; width: 100%; min-height: 56px; text-align: left;
    font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; margin: 8px 0; cursor: pointer;
  }
  .game-row.abandoned { opacity: .55; border-style: dashed; }
  .game-row .sub-line { color: var(--muted); font-size: 14px; }
  .prow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .prow:first-of-type { border-top: 0; }
  .prow .sub-line { color: var(--muted); font-size: 14px; }
  .spark { width: 72px; height: 24px; flex: none; color: var(--accent); overflow: visible; }
  .card h2 .dot { display: inline-block; vertical-align: middle; margin-right: 6px; }

  /* ---- copy, export, import, platform notes (spec 9, 11) ---- */
  a.btn { text-decoration: none; }
  .last-export { color: var(--muted); font-size: .85rem; margin: 14px 0 0; }
  .ios-hint {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--soft); border-radius: 12px; padding: 4px 6px 4px 12px; margin: 8px 0; font-size: 15px;
  }
  .ios-hint span { min-width: 0; }
  .notice { background: var(--card); border: 2px solid var(--error); border-radius: 14px; padding: 12px 14px; margin: 12px 0; }
  .notice p { margin: 0 0 8px; overflow-wrap: anywhere; }
  .notice-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sr-only { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  .import-text {
    display: block; width: 100%; min-height: 160px; margin-top: 4px; padding: 10px 12px; resize: vertical;
    font: 14px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .import-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0 4px; }
  .choice { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 16px; }
  .choice input { margin-top: 4px; width: 22px; height: 22px; flex: none; accent-color: var(--accent); }
  fieldset.mode { border: 0; padding: 0; margin: 12px 0 4px; min-width: 0; }
  fieldset.mode legend { color: var(--muted); font-size: .9rem; padding: 0; margin-bottom: 2px; }
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .55);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    background: var(--card); color: var(--fg); border-radius: 16px; padding: 16px; width: 100%;
    max-width: 480px; display: flex; flex-direction: column; gap: 10px;
  }
  .modal h2 { margin: 0; }
  .modal p { margin: 0; }
  .copy-box {
    width: 100%; height: 42vh; padding: 10px; resize: none; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font: 14px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
</style>
</head>
<body>
<div id="save-banner" class="save-banner" role="alert" hidden>
  <span>Scores are not being saved.</span>
  <button class="btn small" data-action="export">Export</button>
</div>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" role="status" hidden></div>

<script id="logic">
/*
 * Pure logic. No DOM, no localStorage, no window. Runs unmodified in Node.
 * Every mutator takes a state and returns a NEW state; inputs are never modified.
 * Randomness is injected as rand(): a function returning a float in [0, 1).
 *
 * Scoring (step 2): turn order and the cursor are derived from the scores, never
 * stored. Undo/redo and cell edits (step 3) live on the game as action stacks.
 * Step 4 adds playoffs, skip replay and end early. Step 5 adds stats.
 */
const Golf = (() => {
  const SCHEMA_VERSION = 1;
  const APP_ID = 'golf-scorecard'; // the "app" field of an export envelope (spec 9.2)
  const MIN_ROSTER = 1;
  const MAX_ROSTER = 6;

  // Spec section 2. Changing a course id breaks its history: ids are permanent.
  const VENUES = [{
    id: 'redmond', name: 'Flatstick Redmond',
    address: '7530 164th Ave NE, Suite A108, Redmond, WA 98052',
    location: { lat: 47.67199, lng: -122.12129 },
    courses: [
      { id: 'redmond-mini', name: 'Mini Golf', holes: 9, par: [3, 3, 3, 3, 3, 3, 3, 3, 3],
        lowerIsBetter: true, keys: [1, 2, 3, 4, 5, 6, 7, 8] },
      { id: 'redmond-aces', name: 'Aces', holes: 8, par: null,
        lowerIsBetter: true, keys: [1, 2, 3, 4, 5, 6, 7, 8] },
      { id: 'redmond-duff', name: 'Duffleboard', holes: 9, par: null,
        lowerIsBetter: true, keys: [1, 2, 3, 4, 5, 6, 7, 8] },
    ],
  }, {
    id: 'flatstick-kirkland', name: 'Flatstick Kirkland',
    address: '15 Lake St, Suite 100, Kirkland, WA 98033',
    location: { lat: 47.67594, lng: -122.20730 },
    courses: [],
  }, {
    id: 'flatstick-pioneer-square', name: 'Flatstick Pioneer Square',
    address: '240 2nd Ave S, Seattle, WA 98104',
    location: { lat: 47.60016, lng: -122.33101 },
    courses: [],
  }, {
    id: 'flatstick-slu', name: 'Flatstick South Lake Union',
    address: '609 Westlake Ave N, Seattle, WA 98109',
    location: { lat: 47.62502, lng: -122.33877 },
    courses: [],
  }, {
    id: 'flatstick-woodinville', name: 'Flatstick Woodinville',
    address: '13205 NE 175th St, Woodinville, WA 98072',
    location: { lat: 47.75422, lng: -122.16296 }, // TODO verify: OSM address point, not a tagged Flatstick POI
    courses: [
      { id: 'woodinville-mini', name: 'Mini Golf', holes: 9, par: [3, 3, 3, 3, 3, 3, 3, 3, 3],
        lowerIsBetter: true, keys: [1, 2, 3, 4, 5, 6, 7, 8] },
      { id: 'woodinville-duff', name: 'Duffleboard', holes: 9, par: null,
        lowerIsBetter: true, keys: [1, 2, 3, 4, 5, 6, 7, 8] },
      ],
  }, {
    id: 'flatstick-spokane', name: 'Flatstick Spokane',
    address: '618 W Main Ave, Spokane, WA 99201',
    location: { lat: 47.65923, lng: -117.42185 },
    courses: [],
  }, {
    id: 'willows-run', name: 'Willows Run (Rainbow Run)',
    address: '10402 Willows Rd NE, Redmond, WA 98052',
    location: { lat: 47.69019, lng: -122.14915 }, // TODO verify: clubhouse coords; putting course itself is not mapped
    courses: [],
  }, {
    id: 'desert-canyon', name: 'Desert Canyon',
    address: '1201 Desert Canyon Blvd, Orondo, WA 98843',
    location: { lat: 47.72039, lng: -120.18549 }, // TODO verify: clubhouse building coords; putting course itself is not mapped
    courses: [],
  }];

  // Eight distinct colors that read on both light and dark backgrounds.
  const PALETTE = ['#d1495b', '#2d7ff9', '#2f9e44', '#e8a317', '#7048e8', '#0ca3a3', '#e64980', '#495057'];

  function deepFreeze(value) {
    if (value && typeof value === 'object') {
      Object.values(value).forEach(deepFreeze);
      Object.freeze(value);
    }
    return value;
  }
  deepFreeze(VENUES);
  deepFreeze(PALETTE);

  const clone = (value) => JSON.parse(JSON.stringify(value));

  // ---- ids and randomness ----------------------------------------------------

  // 128 random bits drawn from rand(), formatted as hex with a prefix.
  function makeId(prefix, rand = Math.random) {
    let hex = '';
    for (let i = 0; i < 32; i += 1) hex += Math.floor(rand() * 16).toString(16);
    return `${prefix}_${hex}`;
  }

  // Fisher-Yates over a copy. Returns a new array.
  function shuffle(items, rand = Math.random) {
    const out = items.slice();
    for (let i = out.length - 1; i > 0; i -= 1) {
      const j = Math.floor(rand() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  // ---- state and migration ---------------------------------------------------

  function emptyState() {
    return {
      schemaVersion: SCHEMA_VERSION,
      players: [],
      lastRoster: [],
      currentGameId: null,
      lastExportAt: null,
      games: [],
    };
  }

  // MIGRATIONS[n] upgrades a state from schemaVersion n to n + 1.
  // None yet: version 1 is the first version.
  const MIGRATIONS = {};

  function normalize(state) {
    return Object.assign({}, state, {
      schemaVersion: SCHEMA_VERSION,
      players: Array.isArray(state.players) ? state.players : [],
      lastRoster: Array.isArray(state.lastRoster) ? state.lastRoster : [],
      currentGameId: typeof state.currentGameId === 'string' ? state.currentGameId : null,
      lastExportAt: typeof state.lastExportAt === 'string' ? state.lastExportAt : null,
      games: Array.isArray(state.games) ? state.games : [],
    });
  }

  // Returns a current-version state. Throws on unreadable data. Newer data
  // throws with err.code === 'NEWER_SCHEMA' so the UI can refuse to overwrite it.
  function migrate(raw) {
    if (raw === null || raw === undefined) return emptyState();
    if (typeof raw !== 'object' || Array.isArray(raw)) throw new Error('Saved data is not an object.');
    let version = raw.schemaVersion;
    if (!Number.isInteger(version) || version < 1) throw new Error('Saved data has no valid schemaVersion.');
    if (version > SCHEMA_VERSION) {
      const err = new Error(`Saved data is from a newer version of this app (schemaVersion ${version}). Update the app to open it.`);
      err.code = 'NEWER_SCHEMA';
      throw err;
    }
    let state = clone(raw);
    while (version < SCHEMA_VERSION) {
      state = MIGRATIONS[version](state);
      version += 1;
    }
    return normalize(state);
  }

  // ---- venues and courses ----------------------------------------------------

  function defaultVenue() { return VENUES[0]; }

  function getVenue(venueId) {
    return VENUES.find((v) => v.id === venueId) || null;
  }

  // The venue with that id if it has courses, else null. Venues without courses stay
  // out of the picker, geolocation and new games until courses are added (spec 2).
  function playableVenue(venueId) {
    const venue = getVenue(venueId);
    return venue && venue.courses.length ? venue : null;
  }

  function playableVenues(venues = VENUES) {
    return venues.filter((venue) => venue.courses.length > 0);
  }

  function getCourse(courseId) {
    for (const venue of VENUES) {
      const course = venue.courses.find((c) => c.id === courseId);
      if (course) return course;
    }
    return null;
  }

  // The venue the setup screen picks for the next game. Saved so the next setup reuses it.
  function setVenue(state, venueId) {
    if (!playableVenue(venueId)) throw new Error('That venue is not in the list.');
    const next = clone(state);
    next.lastVenueId = venueId;
    return next;
  }

  const EARTH_RADIUS_KM = 6371;

  // Great-circle distance in km between two {lat, lng} points (haversine).
  function distanceKm(a, b) {
    const rad = (deg) => (deg * Math.PI) / 180;
    const dLat = rad(b.lat - a.lat);
    const dLng = rad(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * EARTH_RADIUS_KM * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  // The closest venue with a location within maxKm of pos, as {venue, km}, or null.
  // Venues without a location are skipped. By default only playable venues are checked.
  function nearestVenue(pos, venues = playableVenues(), maxKm = 1) {
    let best = null;
    for (const venue of venues) {
      if (!venue.location) continue;
      const km = distanceKm(pos, venue.location);
      if (km <= maxKm && (!best || km < best.km)) best = { venue, km };
    }
    return best;
  }

  // ---- players ---------------------------------------------------------------

  function visiblePlayers(state) {
    return state.players.filter((p) => !p.hidden);
  }

  function getPlayer(state, id) {
    return state.players.find((p) => p.id === id) || null;
  }

  // Today's roster as player objects, in roster (column) order.
  function rosterPlayers(state) {
    return state.lastRoster
      .map((id) => getPlayer(state, id))
      .filter((p) => p && !p.hidden);
  }

  function normalizeName(name) {
    const trimmed = typeof name === 'string' ? name.trim() : '';
    if (trimmed === '') throw new Error('Name cannot be empty.');
    return trimmed;
  }

  // Uniqueness is checked among visible players, case-insensitively.
  function nameTaken(state, name, exceptId = null) {
    const lower = name.toLowerCase();
    return visiblePlayers(state).some((p) => p.id !== exceptId && p.name.toLowerCase() === lower);
  }

  // First palette color no visible player uses; falls back to cycling.
  function pickColor(state) {
    const used = new Set(visiblePlayers(state).map((p) => p.color));
    return PALETTE.find((c) => !used.has(c)) || PALETTE[state.players.length % PALETTE.length];
  }

  function addPlayer(state, name, rand = Math.random, now = null) {
    const clean = normalizeName(name);
    if (nameTaken(state, clean)) throw new Error(`"${clean}" is already in the player list.`);
    const next = clone(state);
    next.players.push({
      id: makeId('p', rand),
      name: clean,
      color: pickColor(state),
      hidden: false,
      createdAt: now,
    });
    return next;
  }

  function renamePlayer(state, id, name) {
    const clean = normalizeName(name);
    const player = getPlayer(state, id);
    if (!player || player.hidden) throw new Error('That player is not in the list.');
    if (nameTaken(state, clean, id)) throw new Error(`"${clean}" is already in the player list.`);
    const next = clone(state);
    getPlayer(next, id).name = clean;
    return next;
  }

  // Soft delete: history and games are kept; the player leaves today's roster.
  function hidePlayer(state, id) {
    if (!getPlayer(state, id)) throw new Error('That player is not in the list.');
    const next = clone(state);
    getPlayer(next, id).hidden = true;
    next.lastRoster = next.lastRoster.filter((x) => x !== id);
    return next;
  }

  function requireVisible(state, id) {
    const player = getPlayer(state, id);
    if (!player || player.hidden) throw new Error('That player is not in the list.');
    return player;
  }

  function validateRoster(state, ids) {
    if (!Array.isArray(ids) || ids.length < MIN_ROSTER || ids.length > MAX_ROSTER) {
      throw new Error(`Choose between ${MIN_ROSTER} and ${MAX_ROSTER} players.`);
    }
    if (new Set(ids).size !== ids.length) throw new Error('A player can only be picked once.');
    ids.forEach((id) => requireVisible(state, id));
  }

  // "Playing today". Saved so the next New game reuses it.
  function setRoster(state, ids) {
    validateRoster(state, ids);
    const next = clone(state);
    next.lastRoster = ids.slice();
    return next;
  }

  // ---- games -----------------------------------------------------------------

  function getGame(state, gameId) {
    return state.games.find((g) => g.id === gameId) || null;
  }

  function getActiveGame(state) {
    const game = getGame(state, state.currentGameId);
    return game && game.status === 'active' ? game : null;
  }

  function hasAnyScore(game) {
    return game.courses.some((c) => !!c.playoff
      || Object.values(c.scores).some((arr) => arr.some((v) => v !== null)));
  }

  // Creates an active game from lastRoster at venueId (default venue if missing, unknown or without courses).
  // Any previously active game becomes 'abandoned'. The caller decides whether to confirm first.
  function newGame(state, rand = Math.random, now = null, venueId = null) {
    const venue = playableVenue(venueId) || defaultVenue();
    const roster = state.lastRoster.slice();
    validateRoster(state, roster);
    const game = {
      id: makeId('g', rand),
      venueId: venue.id,
      status: 'active',
      startedAt: now,
      finishedAt: null,
      playerIds: roster,
      firstOrder: shuffle(roster, rand),
      courses: venue.courses.map((course) => ({
        courseId: course.id,
        scores: Object.fromEntries(roster.map((id) => [id, new Array(course.holes).fill(null)])),
        playoff: null,
      })),
      replayQueue: null,
      skipsFinal: false,
      awaitingFinish: false,
      endedEarly: false,
      undo: [],
      redo: [],
    };
    const next = clone(state);
    next.games.forEach((g) => { if (g.status === 'active') g.status = 'abandoned'; });
    next.games.push(game);
    next.currentGameId = game.id;
    return next;
  }

  function canRerollFirstOrder(game) {
    return !hasAnyScore(game);
  }

  function rerollFirstOrder(state, gameId, rand = Math.random) {
    const game = getGame(state, gameId);
    if (!game || game.status !== 'active') throw new Error('No active game to re-roll.');
    if (!canRerollFirstOrder(game)) throw new Error('The order can only be re-rolled before the first score.');
    const next = clone(state);
    getGame(next, gameId).firstOrder = shuffle(game.playerIds, rand);
    return next;
  }

  function firstOrderNames(state, game) {
    return game.firstOrder.map((id) => (getPlayer(state, id) || { name: '?' }).name);
  }

  // "Sam goes first, then Adam, Jo"
  function firstOrderSentence(state, game) {
    const [first, ...rest] = firstOrderNames(state, game);
    if (!first) return '';
    if (rest.length === 0) return `${first} goes first`;
    return `${first} goes first, then ${rest.join(', ')}`;
  }

  // ---- scores, totals and course results (spec 4, 5, 6.2) -------------------
  // A cell is null (not entered), 'S' (skipped) or a number from the course keys.

  const isNumber = (v) => typeof v === 'number';

  // Stable sort of ids. keyOf(id) returns [group, value]; lower sorts first.
  function sortStable(ids, keyOf) {
    return ids
      .map((id, pos) => ({ id, pos, key: keyOf(id) }))
      .sort((a, b) => (a.key[0] - b.key[0]) || (a.key[1] - b.key[1]) || (a.pos - b.pos))
      .map((x) => x.id);
  }

  // Totals for one player on one course. Skips add nothing; a skip or an
  // unentered hole makes the card incomplete. vsPar covers the entered holes.
  function courseTotal(game, ci, pid) {
    const course = getCourse(game.courses[ci].courseId);
    const row = game.courses[ci].scores[pid];
    let total = 0;
    let skips = 0;
    let parSoFar = 0;
    let allEntered = true;
    row.forEach((v, h) => {
      if (isNumber(v)) {
        total += v;
        if (course.par) parSoFar += course.par[h];
      } else {
        allEntered = false;
        if (v === 'S') skips += 1;
      }
    });
    return {
      total,
      skips,
      complete: allEntered && skips === 0,
      vsPar: course.par ? total - parSoFar : null,
    };
  }

  // ---- playoffs (spec 7.1) ---------------------------------------------------
  // Derived from the regulation totals. Only the playoff entries are stored (in
  // course.playoff). A stored playoff counts only while its playerIds still match
  // the derived participants; otherwise it is stale and every entry reads as empty.

  const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));

  // Players tied for the lowest total among complete cards, in last-hole order.
  // Empty unless every regulation cell of the course is filled.
  function playoffParticipants(game, ci) {
    if (!courseFilled(game, ci)) return [];
    const course = getCourse(game.courses[ci].courseId);
    const dir = course.lowerIsBetter ? 1 : -1;
    const complete = game.playerIds
      .map((id) => ({ id, total: courseTotal(game, ci, id) }))
      .filter((r) => r.total.complete);
    if (complete.length < 2) return [];
    const best = Math.min(...complete.map((r) => dir * r.total.total));
    const tied = complete.filter((r) => dir * r.total.total === best).map((r) => r.id);
    if (tied.length < 2) return [];
    const lastOrder = courseOrders(game, ci).slice(-1)[0];
    return lastOrder.filter((id) => tied.includes(id));
  }

  // The stored playoff, but only while it is for these participants.
  function livePlayoff(game, ci, participants) {
    const stored = game.courses[ci].playoff;
    return stored && sameSet(stored.playerIds, participants) ? stored : null;
  }

  // Value of playoff entry k (0-based) for a player, or null.
  function playoffValue(po, pid, k) {
    const row = po ? po.scores[pid] : undefined;
    const v = row ? row[k] : undefined;
    return v === undefined ? null : v;
  }

  // Derived playoff for course ci. rounds[k] lists the players who play playoff hole
  // k + 1 in order, and who were eliminated on it. pending is the next entry to make,
  // or null. winnerId is set once one player is left alive.
  function playoffState(game, ci) {
    const participants = playoffParticipants(game, ci);
    const state = {
      needed: participants.length >= 2,
      participants,
      alive: participants.slice(),
      rounds: [],
      holesPlayed: 0,
      winnerId: null,
      decidedOn: null,
      pending: null,
    };
    if (!state.needed) return state;
    const course = getCourse(game.courses[ci].courseId);
    const dir = course.lowerIsBetter ? 1 : -1;
    const pick = course.lowerIsBetter ? Math.min : Math.max;
    const po = livePlayoff(game, ci, participants);
    const valueOf = (pid, k) => playoffValue(po, pid, k);
    let alive = participants.slice();
    let order = participants.slice();
    for (let k = 0; ; k += 1) {
      if (k > 0) {
        // Later holes: the alive players by their previous playoff score, stable.
        const prev = k - 1;
        order = sortStable(order.filter((id) => alive.includes(id)), (id) => {
          const v = valueOf(id, prev);
          return isNumber(v) ? [0, dir * v] : [1, 0];
        });
      }
      const round = {
        pIndex: k, hole: (k % course.holes) + 1, order: order.slice(), complete: false, eliminated: [],
      };
      state.rounds.push(round);
      const missing = order.find((id) => valueOf(id, k) === null);
      if (missing !== undefined) {
        state.pending = { pIndex: k, hole: round.hole, playerId: missing };
        break;
      }
      round.complete = true;
      // The lowest number wins the hole and S is out. If every player entered S, nobody is out.
      const numbers = order.map((id) => valueOf(id, k)).filter(isNumber);
      const keep = numbers.length
        ? order.filter((id) => valueOf(id, k) === pick(...numbers))
        : order.slice();
      round.eliminated = order.filter((id) => !keep.includes(id));
      alive = keep;
      state.holesPlayed += 1;
      if (alive.length === 1) {
        state.winnerId = alive[0];
        state.decidedOn = k + 1;
        break;
      }
    }
    state.alive = alive;
    return state;
  }

  // The playoff winner of course ci, or null. standings() puts them first among tied leaders.
  function playoffWinnerId(game, ci) {
    return playoffState(game, ci).winnerId;
  }

  // Before a write into a playoff, a stale or missing playoff is replaced by a fresh one.
  function ensurePlayoff(game, ci) {
    const participants = playoffParticipants(game, ci);
    if (!livePlayoff(game, ci, participants)) {
      game.courses[ci].playoff = { playerIds: participants, scores: {} };
    }
  }

  // Writes playoff entry k (0-based) for a player. Expects a live playoff.
  function writePlayoff(game, ci, pid, k, value) {
    const po = game.courses[ci].playoff;
    const row = po.scores[pid] ? po.scores[pid].slice() : [];
    while (row.length < k) row.push(null);
    row[k] = value;
    po.scores[pid] = row;
  }

  // Final standings of a course: complete cards first, then by total, then by the
  // course's last-hole order (ties stay stable).
  function standings(game, ci) {
    const course = getCourse(game.courses[ci].courseId);
    const dir = course.lowerIsBetter ? 1 : -1;
    const totals = new Map(game.playerIds.map((id) => [id, courseTotal(game, ci, id)]));
    const lastOrder = courseOrders(game, ci).slice(-1)[0];
    let order = sortStable(lastOrder, (id) => {
      const t = totals.get(id);
      return [t.complete ? 0 : 1, dir * t.total];
    });
    const winnerId = playoffWinnerId(game, ci);
    const lead = totals.get(order[0]);
    if (winnerId && lead && lead.complete && totals.get(winnerId).complete
      && totals.get(winnerId).total === lead.total) {
      order = [winnerId, ...order.filter((id) => id !== winnerId)];
    }
    return order;
  }

  // Play order for every hole of a course, index h-1.
  // Hole 1: firstOrder for the first course, otherwise the previous course's standings.
  // Hole h: players sorted by their score on hole h-1 (best first, S and blanks last),
  // stable relative to the order they had on hole h-1.
  function courseOrders(game, ci) {
    const course = getCourse(game.courses[ci].courseId);
    const scores = game.courses[ci].scores;
    const dir = course.lowerIsBetter ? 1 : -1;
    let order = ci === 0 ? game.firstOrder.slice() : standings(game, ci - 1);
    const orders = [order];
    for (let h = 2; h <= course.holes; h += 1) {
      const idx = h - 2;
      order = sortStable(order, (id) => {
        const v = scores[id][idx];
        return isNumber(v) ? [0, dir * v] : [1, 0];
      });
      orders.push(order);
    }
    return orders;
  }

  function turnOrder(game, courseIndex, hole) {
    const orders = courseOrders(game, courseIndex);
    if (!orders[hole - 1]) throw new Error(`No hole ${hole} on course ${courseIndex}.`);
    return orders[hole - 1].slice();
  }

  // Every regulation cell in play order: {courseIndex, hole, playerId}.
  function playOrder(game) {
    const cells = [];
    game.courses.forEach((_, ci) => {
      courseOrders(game, ci).forEach((order, h) => {
        order.forEach((playerId) => cells.push({ courseIndex: ci, hole: h + 1, playerId }));
      });
    });
    return cells;
  }

  // Regulation skips in replay order: course, then hole, then column order.
  function regulationSkips(game) {
    const list = [];
    game.courses.forEach((entry, ci) => {
      const { holes } = getCourse(entry.courseId);
      for (let h = 1; h <= holes; h += 1) {
        game.playerIds.forEach((pid) => {
          if (entry.scores[pid][h - 1] === 'S') list.push({ courseIndex: ci, hole: h, playerId: pid });
        });
      }
    });
    return list;
  }

  // True while a replay queue entry is waiting for this regulation cell.
  function replayQueued(game, ci, hole, pid) {
    return Array.isArray(game.replayQueue)
      && game.replayQueue.some((c) => c.courseIndex === ci && c.hole === hole && c.playerId === pid);
  }

  // First unentered regulation cell of course ci in play order, or null.
  function firstEmptyCell(game, ci) {
    const orders = courseOrders(game, ci);
    for (let h = 0; h < orders.length; h += 1) {
      for (const pid of orders[h]) {
        if (game.courses[ci].scores[pid][h] === null) return { courseIndex: ci, hole: h + 1, playerId: pid };
      }
    }
    return null;
  }

  // DERIVED, never stored: the next cell to enter, or null when nothing is left.
  // Course by course: its first empty regulation cell, then its pending playoff entry.
  // The replay queue is only non-empty once every regulation cell is filled, and it
  // comes before playoffs, so a replay that creates a tie waits until the replay ends.
  function cursor(game) {
    const queue = Array.isArray(game.replayQueue) ? game.replayQueue : [];
    for (let ci = 0; ci < game.courses.length; ci += 1) {
      const cell = firstEmptyCell(game, ci);
      if (cell) return cell;
      if (queue.length) continue;
      const { pending } = playoffState(game, ci);
      if (pending) {
        return {
          courseIndex: ci, hole: pending.hole, playerId: pending.playerId, playoff: true, pIndex: pending.pIndex,
        };
      }
    }
    if (queue.length) {
      const head = queue[0];
      return { courseIndex: head.courseIndex, hole: head.hole, playerId: head.playerId, replay: true };
    }
    return null;
  }

  // What the game needs next (spec 7, 7.2):
  // 'play', 'playoff' or 'replay' while a cell is open; 'skipDecision' when everything is
  // entered, regulation skips remain and the user has not decided; 'review' after a reopen
  // with nothing left to enter; otherwise 'done'. An ended-early game is 'done'.
  function gamePhase(game) {
    if (game.endedEarly) return 'done';
    const cur = cursor(game);
    if (cur) {
      if (cur.replay) return 'replay';
      return cur.playoff ? 'playoff' : 'play';
    }
    if (game.replayQueue == null && game.skipsFinal !== true && regulationSkips(game).length > 0) {
      return 'skipDecision';
    }
    return game.awaitingFinish ? 'review' : 'done';
  }

  // The player after the cursor in play order (for "next: Jo"), or null.
  function upNext(game, cur) {
    if (!cur || cur.replay) return null;
    if (cur.playoff) {
      const round = playoffState(game, cur.courseIndex).rounds[cur.pIndex];
      const i = round ? round.order.indexOf(cur.playerId) : -1;
      return i >= 0 && round.order[i + 1] ? round.order[i + 1] : null;
    }
    const cells = playOrder(game);
    const idx = cells.findIndex((c) => c.courseIndex === cur.courseIndex
      && c.hole === cur.hole && c.playerId === cur.playerId);
    return idx >= 0 && cells[idx + 1] ? cells[idx + 1].playerId : null;
  }

  // ---- recording, editing, undo and redo (spec 6.3, 6.4, 7.1, 7.2) ------------
  // An action is {type:'set', courseIndex, hole, playerId, prev, next}. Playoff entries
  // add playoff: true, pIndex and playoffBefore (the playoff object before the write,
  // restored by undo). Replay entries add replay: true. Undo puts their cell back at the
  // head of replayQueue and redo takes it off again.

  // The value of the cell a cursor or an edit points at (null if not entered).
  function cellValue(game, cur) {
    if (cur.playoff) {
      const po = livePlayoff(game, cur.courseIndex, playoffParticipants(game, cur.courseIndex));
      return playoffValue(po, cur.playerId, cur.pIndex);
    }
    return game.courses[cur.courseIndex].scores[cur.playerId][cur.hole - 1];
  }

  function actionFor(cur, prev, next) {
    const action = {
      type: 'set', courseIndex: cur.courseIndex, hole: cur.hole, playerId: cur.playerId, prev, next,
    };
    if (cur.playoff) {
      action.playoff = true;
      action.pIndex = cur.pIndex;
    }
    if (cur.replay) action.replay = true;
    return action;
  }

  // Writes a value into the cell an action points at.
  function writeCell(game, action, value) {
    if (action.playoff) {
      ensurePlayoff(game, action.courseIndex);
      writePlayoff(game, action.courseIndex, action.playerId, action.pIndex, value);
    } else {
      game.courses[action.courseIndex].scores[action.playerId][action.hole - 1] = value;
    }
  }

  // Keeps status in line with the phase: 'finished' exactly when the phase is 'done'.
  // Ended-early games stay finished.
  function syncStatus(game, now) {
    if (game.endedEarly) return;
    const done = gamePhase(game) === 'done';
    if (game.status === 'active' && done) {
      game.status = 'finished';
      game.finishedAt = now;
    } else if (game.status === 'finished' && !done) {
      game.status = 'active';
      game.finishedAt = null;
    }
  }

  // Records one score at the cursor (regulation, playoff or replay). value is one of the
  // course keys or 'S'. Returns a new state. The last open cell finishes the game.
  function recordScore(state, gameId, value, now = null) {
    const game = getGame(state, gameId);
    if (!game || game.status !== 'active') throw new Error('No active game to score.');
    const cur = cursor(game);
    if (!cur) throw new Error('Every hole is already scored.');
    const course = getCourse(game.courses[cur.courseIndex].courseId);
    if (!(value === 'S' || course.keys.includes(value))) {
      throw new Error(`Score must be one of ${course.keys.join(', ')} or S.`);
    }
    const next = clone(state);
    const target = getGame(next, gameId);
    const action = actionFor(cur, cellValue(game, cur), value);
    if (cur.playoff) action.playoffBefore = clone(target.courses[cur.courseIndex].playoff);
    writeCell(target, action, value);
    if (cur.replay) target.replayQueue.shift();
    target.undo.push(action);
    target.redo = [];
    syncStatus(target, now);
    return next;
  }

  // Overwrites a FILLED cell of an active game (spec 6.4). Undoable. Returns a new state.
  // Playoff cells: pass pIndex (0-based) and the hole is ignored.
  function editScore(state, gameId, courseIndex, hole, playerId, value, now = null, pIndex = null) {
    const game = getGame(state, gameId);
    if (!game || game.status !== 'active') throw new Error('No active game to edit.');
    const entry = game.courses[courseIndex];
    if (!entry) throw new Error('That cell is not on the card.');
    let cur;
    if (pIndex !== null) {
      const round = playoffState(game, courseIndex).rounds[pIndex];
      if (!round || !round.order.includes(playerId)) throw new Error('That cell is not on the card.');
      cur = { courseIndex, hole: round.hole, playerId, playoff: true, pIndex };
    } else {
      const row = entry.scores[playerId];
      if (!Array.isArray(row) || !Number.isInteger(hole) || hole < 1 || hole > row.length) {
        throw new Error('That cell is not on the card.');
      }
      if (replayQueued(game, courseIndex, hole, playerId)) {
        throw new Error('Enter that hole with the numpad during the replay.');
      }
      cur = { courseIndex, hole, playerId };
    }
    const prev = cellValue(game, cur);
    if (prev === null) throw new Error('Only a filled cell can be edited.');
    const course = getCourse(entry.courseId);
    if (!(value === 'S' || course.keys.includes(value))) {
      throw new Error(`Score must be one of ${course.keys.join(', ')} or S.`);
    }
    const next = clone(state);
    const target = getGame(next, gameId);
    const action = actionFor(cur, prev, value);
    if (cur.playoff) action.playoffBefore = clone(target.courses[courseIndex].playoff);
    writeCell(target, action, value);
    target.undo.push(action);
    target.redo = [];
    syncStatus(target, now);
    return next;
  }

  // Undo and redo work on active and finished games, so a finished game can be reopened.
  function canUndo(state, gameId) {
    const game = getGame(state, gameId);
    return !!game && (game.status === 'active' || game.status === 'finished') && game.undo.length > 0;
  }

  function canRedo(state, gameId) {
    const game = getGame(state, gameId);
    return !!game && (game.status === 'active' || game.status === 'finished') && game.redo.length > 0;
  }

  // Restores the previous state of the last action and keeps the replay queue in step.
  function undo(state, gameId) {
    if (!canUndo(state, gameId)) throw new Error('Nothing to undo.');
    const next = clone(state);
    const game = getGame(next, gameId);
    const action = game.undo.pop();
    if (action.playoff) {
      game.courses[action.courseIndex].playoff = clone(action.playoffBefore);
    } else {
      writeCell(game, action, action.prev);
    }
    if (action.replay && Array.isArray(game.replayQueue)) {
      game.replayQueue.unshift({ courseIndex: action.courseIndex, hole: action.hole, playerId: action.playerId });
    }
    game.redo.push(action);
    syncStatus(game, null);
    return next;
  }

  // Re-applies the last undone action. If it finishes the last open cell, the game finishes at now.
  function redo(state, gameId, now = null) {
    if (!canRedo(state, gameId)) throw new Error('Nothing to redo.');
    const next = clone(state);
    const game = getGame(next, gameId);
    const action = game.redo.pop();
    writeCell(game, action, action.next);
    if (action.replay && Array.isArray(game.replayQueue)) game.replayQueue.shift();
    game.undo.push(action);
    syncStatus(game, now);
    return next;
  }

  // Replay (spec 7.2): offers every skipped regulation cell again, in replay order.
  function startReplay(state, gameId) {
    const game = getGame(state, gameId);
    if (!game || game.status !== 'active' || gamePhase(game) !== 'skipDecision') {
      throw new Error('Replay is offered once every hole is scored and skips remain.');
    }
    const next = clone(state);
    getGame(next, gameId).replayQueue = regulationSkips(game);
    return next;
  }

  // Ends the skip decision with the skips left in place (spec 7.2).
  function finishAnyway(state, gameId, now = null) {
    const game = getGame(state, gameId);
    if (!game || game.status !== 'active' || gamePhase(game) !== 'skipDecision') {
      throw new Error('There is no skip decision to make.');
    }
    const next = clone(state);
    const target = getGame(next, gameId);
    target.skipsFinal = true;
    target.awaitingFinish = false;
    syncStatus(target, now);
    return next;
  }

  // End early (spec 7): unentered cells stay null, so those courses are incomplete.
  function endEarly(state, gameId, now = null) {
    const game = getGame(state, gameId);
    if (!game || game.status !== 'active') throw new Error('No active game to end.');
    const next = clone(state);
    const target = getGame(next, gameId);
    target.status = 'finished';
    target.endedEarly = true;
    target.finishedAt = now;
    return next;
  }

  // Reopens a finished game (spec 7). Abandons any other active game and offers the skip
  // decision again. With nothing left to enter it waits in 'review' for finishGame.
  function reopenGame(state, gameId) {
    const game = getGame(state, gameId);
    if (!game || game.status !== 'finished') throw new Error('Only a finished game can be reopened.');
    const next = clone(state);
    next.games.forEach((g) => { if (g.status === 'active') g.status = 'abandoned'; });
    const target = getGame(next, gameId);
    target.status = 'active';
    target.finishedAt = null;
    target.endedEarly = false;
    target.skipsFinal = false;
    target.replayQueue = null;
    target.awaitingFinish = false;
    next.currentGameId = gameId;
    if (gamePhase(target) === 'done') target.awaitingFinish = true;
    return next;
  }

  // Explicit finish for a reopened game in the 'review' phase.
  function finishGame(state, gameId, now = null) {
    const game = getGame(state, gameId);
    if (!game || game.status !== 'active' || gamePhase(game) !== 'review') throw new Error('Nothing to finish.');
    const next = clone(state);
    const target = getGame(next, gameId);
    target.awaitingFinish = false;
    syncStatus(target, now);
    return next;
  }

  // What the now-up bar shows as the prior score: the player's previous hole on
  // this course, or on hole 1 of courses 2+ the previous course's total.
  function priorHoleInfo(game, cur) {
    if (!cur) return null;
    const { courseIndex: ci, hole, playerId } = cur;
    if (hole > 1) {
      return { kind: 'hole', label: `Hole ${hole - 1}`, score: game.courses[ci].scores[playerId][hole - 2] };
    }
    if (ci === 0) return null;
    const prevCourse = getCourse(game.courses[ci - 1].courseId);
    const t = courseTotal(game, ci - 1, playerId);
    return {
      kind: 'course', label: prevCourse.name, total: t.total, skips: t.skips, complete: t.complete, vsPar: t.vsPar,
    };
  }

  // Result of a course. The winner is the lone complete player with the lowest total, or
  // the playoff winner when that total is tied (decidedBy 'playoff', decidedOn = P number).
  // provisional: someone's card is still incomplete and the skip decision is not final.
  // skips maps each player to their skip count on this course.
  function courseResult(game, ci) {
    const course = getCourse(game.courses[ci].courseId);
    const pick = course.lowerIsBetter ? Math.min : Math.max;
    const all = game.playerIds.map((id) => ({ id, ...courseTotal(game, ci, id) }));
    const rows = all.filter((r) => r.complete);
    const skips = Object.fromEntries(all.map((r) => [r.id, r.skips]));
    const incomplete = all.some((r) => !r.complete);
    const provisional = incomplete && game.skipsFinal !== true && game.endedEarly !== true;
    if (rows.length === 0) {
      return {
        winnerId: null, leaders: [], total: null, runnerUpTotal: null, tied: false,
        decidedBy: null, decidedOn: null, provisional, skips,
      };
    }
    const best = pick(...rows.map((r) => r.total));
    const leaders = rows.filter((r) => r.total === best).map((r) => r.id);
    const others = rows.filter((r) => r.total !== best).map((r) => r.total);
    const result = {
      winnerId: leaders.length === 1 ? leaders[0] : null,
      leaders,
      total: best,
      runnerUpTotal: others.length ? pick(...others) : null,
      tied: leaders.length > 1,
      decidedBy: leaders.length === 1 ? 'strokes' : null,
      decidedOn: null,
      provisional,
      skips,
    };
    if (leaders.length > 1) {
      const ps = playoffState(game, ci);
      if (ps.winnerId) {
        Object.assign(result, { winnerId: ps.winnerId, decidedBy: 'playoff', decidedOn: ps.decidedOn });
      }
    }
    return result;
  }

  // True when every cell of course ci is filled (skips count as filled).
  function courseFilled(game, ci) {
    return game.playerIds.every((id) => game.courses[ci].scores[id].every((v) => v !== null));
  }

  // ---- stats (spec 8). Derived on every call from the games; nothing is stored. ----
  // A round is one player's card on one course in one game. Only finished games count,
  // and only complete cards (every regulation cell a number). Playoff strokes never count.

  const MIN_POOL = 5; // a percentile needs at least this many prior rounds in its pool
  const timeOf = (iso) => Date.parse(iso) || 0;

  // Every complete round on a course from finished games.
  function courseRounds(state, courseId) {
    const rounds = [];
    state.games.forEach((game) => {
      if (game.status !== 'finished') return;
      game.courses.forEach((entry, ci) => {
        if (entry.courseId !== courseId) return;
        game.playerIds.forEach((pid) => {
          const t = courseTotal(game, ci, pid);
          if (t.complete) rounds.push({ gameId: game.id, finishedAt: game.finishedAt, playerId: pid, total: t.total });
        });
      });
    });
    return rounds;
  }

  // Complete rounds on the course from games that finished before this one (by finishedAt).
  // Order-independent: a reopened and refinished game moves in the order it finishes now.
  function priorRounds(state, game, courseId) {
    if (!game.finishedAt) return [];
    const end = timeOf(game.finishedAt);
    return courseRounds(state, courseId)
      .filter((r) => r.gameId !== game.id && timeOf(r.finishedAt) < end);
  }

  // Share of the pool that this total beats, with ties counting half, rounded.
  // Null below MIN_POOL rounds. Lower is better on every course here.
  function percentileOf(total, pool, lowerIsBetter = true) {
    if (pool.length < MIN_POOL) return null;
    const dir = lowerIsBetter ? 1 : -1;
    let beaten = 0;
    let tied = 0;
    pool.forEach((t) => {
      if (dir * t > dir * total) beaten += 1;
      else if (t === total) tied += 1;
    });
    return Math.round(((beaten + 0.5 * tied) / pool.length) * 100);
  }

  // Personal record for a complete total against the player's prior complete totals.
  function recordFor(total, priorTotals, lowerIsBetter = true) {
    if (priorTotals.length === 0) return { kind: 'first' };
    const dir = lowerIsBetter ? 1 : -1;
    const best = (lowerIsBetter ? Math.min : Math.max)(...priorTotals);
    if (dir * total < dir * best) return { kind: 'new', previousBest: best };
    if (total === best) return { kind: 'tied' };
    return null;
  }

  // Lifetime course wins as winner -> (other player -> count). Finished games only, and a
  // win counts over each other player who has a complete round on that course.
  function winTable(state) {
    const table = new Map();
    state.games.forEach((game) => {
      if (game.status !== 'finished') return;
      game.courses.forEach((_, ci) => {
        const { winnerId } = courseResult(game, ci);
        if (!winnerId) return;
        game.playerIds.forEach((pid) => {
          if (pid === winnerId || !courseTotal(game, ci, pid).complete) return;
          if (!table.has(winnerId)) table.set(winnerId, new Map());
          const row = table.get(winnerId);
          row.set(pid, (row.get(pid) || 0) + 1);
        });
      });
    });
    return table;
  }

  function courseStats(state, game, ci) {
    const entry = game.courses[ci];
    const course = getCourse(entry.courseId);
    const dir = course.lowerIsBetter ? 1 : -1;
    const prior = priorRounds(state, game, entry.courseId);
    const allTotals = prior.map((r) => r.total);
    const rows = standings(game, ci).map((pid) => {
      const t = courseTotal(game, ci, pid);
      const mine = prior.filter((r) => r.playerId === pid).map((r) => r.total);
      const row = {
        playerId: pid,
        total: t.total,
        vsPar: t.vsPar,
        complete: t.complete,
        skips: t.skips,
        record: null,
        pctAll: null,
        pctPersonal: null,
        rank: null,
        ofCount: null,
        priorCount: mine.length,
        allPriorCount: allTotals.length,
        holesInOne: course.par ? entry.scores[pid].filter((v) => v === 1).length : null,
      };
      if (t.complete) {
        const pool = mine.concat([t.total]);
        row.record = recordFor(t.total, mine, course.lowerIsBetter);
        row.pctAll = percentileOf(t.total, allTotals, course.lowerIsBetter);
        row.pctPersonal = percentileOf(t.total, mine, course.lowerIsBetter);
        row.rank = 1 + pool.filter((x) => dir * x < dir * t.total).length;
        row.ofCount = pool.length;
      }
      return row;
    });
    // Highlights for this course's card. Each hole's average is over the numeric entries.
    let hardestHole = null;
    const bestHoles = [];
    for (let h = 0; h < course.holes; h += 1) {
      const cells = game.playerIds
        .map((pid) => ({ playerId: pid, score: entry.scores[pid][h] }))
        .filter((c) => isNumber(c.score));
      if (cells.length) {
        const avg = cells.reduce((sum, c) => sum + c.score, 0) / cells.length;
        if (!hardestHole || avg > hardestHole.avg) hardestHole = { hole: h + 1, avg };
        cells.forEach((c) => {
          if (avg - c.score > 0) {
            bestHoles.push({ playerId: c.playerId, hole: h + 1, score: c.score, avg, beat: avg - c.score });
          }
        });
      }
    }
    bestHoles.sort((a, b) => (b.beat - a.beat) || (a.hole - b.hole));
    const result = courseResult(game, ci);
    return {
      courseId: entry.courseId,
      name: course.name,
      courseIndex: ci,
      played: game.playerIds.some((id) => entry.scores[id].some((v) => v !== null)),
      standings: rows,
      winnerId: result.winnerId,
      decidedBy: result.decidedBy,
      decidedOn: result.decidedOn,
      hardestHole,
      bestHoles,
    };
  }

  // Stats for one game. Call it on a finished game. Session wins count courses won, and
  // champions are the players with the most (more than one means co-champions).
  function gameStats(state, gameId) {
    const game = getGame(state, gameId);
    if (!game) throw new Error('That game is not in the history.');
    const courses = game.courses.map((_, ci) => courseStats(state, game, ci));
    const wins = Object.fromEntries(game.playerIds.map((id) => [id, 0]));
    courses.forEach((c) => { if (c.winnerId) wins[c.winnerId] += 1; });
    const most = Math.max(0, ...Object.values(wins));
    const champions = most > 0 ? game.playerIds.filter((id) => wins[id] === most) : [];
    const table = winTable(state);
    const headToHead = [];
    game.playerIds.forEach((a, i) => {
      game.playerIds.slice(i + 1).forEach((b) => {
        headToHead.push({
          a, b, aWins: (table.get(a) && table.get(a).get(b)) || 0, bWins: (table.get(b) && table.get(b).get(a)) || 0,
        });
      });
    });
    return { courses, wins, champions, headToHead };
  }

  // Per course: rounds, best total, average (1 decimal) and the last five totals (oldest first).
  // Covers the default venue's courses, plus any other course the player has rounds on.
  function playerHistory(state, playerId) {
    const home = new Set(defaultVenue().courses.map((c) => c.id));
    const courses = VENUES.flatMap((venue) => venue.courses).filter((course) => home.has(course.id)
      || courseRounds(state, course.id).some((r) => r.playerId === playerId));
    return courses.map((course) => {
      const totals = courseRounds(state, course.id)
        .filter((r) => r.playerId === playerId)
        .sort((a, b) => timeOf(a.finishedAt) - timeOf(b.finishedAt))
        .map((r) => r.total);
      const sum = totals.reduce((a, b) => a + b, 0);
      return {
        courseId: course.id,
        name: course.name,
        rounds: totals.length,
        best: totals.length ? Math.min(...totals) : null,
        average: totals.length ? Math.round((sum / totals.length) * 10) / 10 : null,
        last5: totals.slice(-5),
      };
    });
  }

  // Every game, newest first. Winners are listed for finished games only.
  function listGames(state) {
    return state.games
      .map((game) => ({
        id: game.id,
        status: game.status,
        startedAt: game.startedAt,
        finishedAt: game.finishedAt,
        endedEarly: game.endedEarly === true,
        playerIds: game.playerIds.slice(),
        winners: game.status !== 'finished' ? [] : game.courses.flatMap((entry, ci) => {
          const r = courseResult(game, ci);
          return r.winnerId ? [{ courseId: entry.courseId, winnerId: r.winnerId, decidedBy: r.decidedBy }] : [];
        }),
      }))
      .sort((a, b) => timeOf(b.startedAt) - timeOf(a.startedAt));
  }

  // The finished game with the latest finishedAt, or null. Only it can be reopened from history.
  function latestFinishedGameId(state) {
    let best = null;
    state.games.forEach((game) => {
      if (game.status !== 'finished') return;
      if (!best || timeOf(game.finishedAt) > timeOf(best.finishedAt)) best = game;
    });
    return best ? best.id : null;
  }

  // ---- copy scores, export and import (spec 9, step 6) -----------------------

  const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const DAY_MS = 86400000;

  // "Tue Oct 14 2026" from the local calendar, built from its parts (no locale formatting).
  function dayLabel(iso) {
    const ms = Date.parse(iso);
    if (Number.isNaN(ms)) return '';
    const d = new Date(ms);
    return `${DAY_NAMES[d.getDay()]} ${MONTH_NAMES[d.getMonth()]} ${d.getDate()} ${d.getFullYear()}`;
  }

  // Whole days from iso to now (never negative), or null if either is not a date.
  function daysSince(iso, now) {
    const then = Date.parse(iso);
    const at = Date.parse(now);
    if (Number.isNaN(then) || Number.isNaN(at)) return null;
    return Math.max(0, Math.floor((at - then) / DAY_MS));
  }

  // Spec 9.1: the game as plain text, for a text message. Works on an active game too:
  // unentered cells print as '-', an incomplete total gets '*', and a course with no
  // entries is left out. Only decided courses (no skip still open) crown a winner.
  function scoresText(state, gameId) {
    const game = getGame(state, gameId);
    if (!game) throw new Error('That game is not in the history.');
    const venue = getVenue(game.venueId) || defaultVenue();
    const nameOf = (id) => (getPlayer(state, id) || { name: '?' }).name;
    const stats = gameStats(state, gameId);
    const nameWidth = Math.max(...game.playerIds.map((id) => nameOf(id).length));
    const indent = ' '.repeat(nameWidth + 2);
    const decided = game.courses.map((_, ci) => {
      const r = courseResult(game, ci);
      return r.winnerId && !r.provisional ? r.winnerId : null;
    });

    const blocks = [];
    game.courses.forEach((entry, ci) => {
      const course = getCourse(entry.courseId);
      if (!stats.courses[ci].played) return;
      const totals = game.playerIds.map((pid) => courseTotal(game, ci, pid));
      const totalText = totals.map((t) => `${t.total}${t.complete ? '' : '*'}`);
      const totalWidth = Math.max(3, ...totalText.map((s) => s.length));
      const parTotal = course.par ? course.par.reduce((a, b) => a + b, 0) : null;
      const heading = `${course.name}${parTotal === null ? '' : ` (par ${parTotal})`}`;
      const holeLabels = Array.from({ length: course.holes }, (_, h) => String(h + 1));
      const lines = [heading, `${indent}${holeLabels.join(' ')}  ${'Tot'.padStart(totalWidth)}`];
      game.playerIds.forEach((pid, i) => {
        const cells = entry.scores[pid].map((v) => (v === null ? '-' : String(v)));
        const crown = decided[ci] === pid ? '  👑' : '';
        lines.push(`${nameOf(pid).padEnd(nameWidth)}  ${cells.join(' ')}  ${totalText[i].padStart(totalWidth)}${crown}`);
      });
      getPlayoffLines(game, ci, nameOf).forEach((text) => lines.push(`${indent}Playoff: ${text}`));
      blocks.push(lines.join('\n'));
    });

    const head = `⛳ ${venue.name}${dayLabel(game.startedAt) ? ` · ${dayLabel(game.startedAt)}` : ''}`;
    const out = [head, ''];
    out.push(blocks.length ? blocks.join('\n\n') : 'No scores yet.');

    const wins = new Map();
    decided.forEach((pid) => { if (pid) wins.set(pid, (wins.get(pid) || 0) + 1); });
    const ranked = game.playerIds
      .filter((pid) => wins.has(pid))
      .sort((a, b) => wins.get(b) - wins.get(a));
    if (ranked.length) {
      out.push('', `Course wins: ${ranked.map((pid) => `${nameOf(pid)} ${wins.get(pid)}`).join(', ')}`);
    }
    game.courses.forEach((entry, ci) => {
      const course = getCourse(entry.courseId);
      stats.courses[ci].standings.forEach((row) => {
        if (row.record && row.record.kind === 'new') {
          out.push(`🎉 ${nameOf(row.playerId)}: new ${course.name} record (${row.total})`);
        }
      });
    });
    return out.join('\n');
  }

  // One text per playoff hole that has entries, e.g. "Adam 2, Sam 3 (P1)", joined by "; ".
  function getPlayoffLines(game, ci, nameOf) {
    const ps = playoffState(game, ci);
    const parts = ps.rounds.map((round) => {
      const entries = round.order
        .map((pid) => [pid, cellValue(game, {
          courseIndex: ci, hole: round.hole, playerId: pid, playoff: true, pIndex: round.pIndex,
        })])
        .filter(([, v]) => v !== null);
      if (!entries.length) return null;
      return `${entries.map(([pid, v]) => `${nameOf(pid)} ${v}`).join(', ')} (P${round.pIndex + 1})`;
    }).filter(Boolean);
    return parts.length ? [parts.join('; ')] : [];
  }

  // Spec 9.2: the envelope written by Export all data. Does not change state.
  function exportEnvelope(state, now) {
    return {
      app: APP_ID, schemaVersion: SCHEMA_VERSION, exportedAt: now, data: clone(state),
    };
  }

  // Records that a copy or download happened, so Home can show "Last export".
  function markExported(state, now) {
    const next = clone(state);
    next.lastExportAt = now;
    return next;
  }

  const isPlainObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

  const newerMessage = (v) => `This file is from a newer version of Golf Scorecard (schemaVersion ${v}). Update the app before importing it.`;

  // A light structural check after migration, so a bad file is refused before it is merged.
  function shapeProblem(state) {
    if (!state.players.every((p) => isPlainObject(p) && typeof p.id === 'string' && typeof p.name === 'string')) {
      return 'A player in the file is missing its id or name.';
    }
    const gamesOk = state.games.every((g) => isPlainObject(g) && typeof g.id === 'string'
      && ['active', 'finished', 'abandoned'].includes(g.status)
      && Array.isArray(g.playerIds) && Array.isArray(g.courses)
      && Array.isArray(g.undo) && Array.isArray(g.redo)
      && g.courses.every((c) => isPlainObject(c) && isPlainObject(c.scores)));
    return gamesOk ? null : 'A game in the file is malformed.';
  }

  // Reads an export envelope, or a bare state object. Never throws; returns
  // {ok:false, error, summary:null} or {ok:true, error:null, state, exportedAt, summary}.
  function parseImport(text) {
    const fail = (error) => ({
      ok: false, error, state: null, exportedAt: null, summary: null,
    });
    if (typeof text !== 'string' || text.trim() === '') return fail('Paste the JSON from an export, or choose a file.');
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      return fail('That is not valid JSON. Copy the whole export, from the first { to the last }.');
    }
    if (!isPlainObject(parsed)) return fail('That does not look like Golf Scorecard data.');
    let data = parsed;
    let exportedAt = null;
    if (Object.prototype.hasOwnProperty.call(parsed, 'app')) {
      if (parsed.app !== APP_ID) return fail('This file is not a Golf Scorecard export.');
      if (Number.isInteger(parsed.schemaVersion) && parsed.schemaVersion > SCHEMA_VERSION) {
        return fail(newerMessage(parsed.schemaVersion));
      }
      if (!isPlainObject(parsed.data)) return fail('The export has no data in it.');
      data = parsed.data;
      exportedAt = typeof parsed.exportedAt === 'string' ? parsed.exportedAt : null;
    }
    if (Number.isInteger(data.schemaVersion) && data.schemaVersion > SCHEMA_VERSION) {
      return fail(newerMessage(data.schemaVersion));
    }
    if (!Array.isArray(data.players) || !Array.isArray(data.games)) {
      return fail('The data has no players or games list.');
    }
    let state;
    try {
      state = migrate(data);
    } catch (e) {
      return fail(`The data could not be read: ${e.message}`);
    }
    const problem = shapeProblem(state);
    if (problem) return fail(problem);
    return {
      ok: true,
      error: null,
      state,
      exportedAt,
      summary: { players: state.players.length, games: state.games.length },
    };
  }

  // Of two copies of one game id: a finished copy beats an active one, and between two
  // finished copies the later finishedAt wins. Otherwise the current copy is kept.
  function pickGame(current, incoming) {
    const currentDone = current.status === 'finished';
    const incomingDone = incoming.status === 'finished';
    if (incomingDone && !currentDone) return incoming;
    if (currentDone && incomingDone && timeOf(incoming.finishedAt) > timeOf(current.finishedAt)) return incoming;
    return current;
  }

  // Union of two states (spec 9.3). Players and games are matched by id. A player id
  // keeps the current copy. The roster stays the current one. The newest active game
  // (by startedAt) is the only active game; any other active game is abandoned, and it
  // becomes currentGameId so Resume can reach it.
  function mergeStates(current, incoming) {
    const cur = clone(current);
    const inc = clone(incoming);
    const players = cur.players.slice();
    const havePlayer = new Set(players.map((p) => p.id));
    inc.players.forEach((p) => {
      if (!havePlayer.has(p.id)) { havePlayer.add(p.id); players.push(p); }
    });
    const games = cur.games.slice();
    const at = new Map(games.map((g, i) => [g.id, i]));
    inc.games.forEach((g) => {
      if (!at.has(g.id)) { at.set(g.id, games.length); games.push(g); return; }
      const i = at.get(g.id);
      games[i] = pickGame(games[i], g);
    });
    const actives = games.filter((g) => g.status === 'active');
    let currentGameId = cur.currentGameId;
    if (actives.length) {
      const keep = actives.reduce((best, g) => {
        const a = timeOf(g.startedAt);
        const b = timeOf(best.startedAt);
        if (a > b || (a === b && g.id === cur.currentGameId)) return g;
        return best;
      });
      games.forEach((g) => { if (g.status === 'active' && g.id !== keep.id) g.status = 'abandoned'; });
      currentGameId = keep.id;
    }
    const stamps = [cur.lastExportAt, inc.lastExportAt].filter((x) => typeof x === 'string');
    const lastExportAt = stamps.length ? stamps.reduce((a, b) => (timeOf(b) > timeOf(a) ? b : a)) : null;
    return normalize({
      schemaVersion: SCHEMA_VERSION,
      players,
      lastRoster: cur.lastRoster,
      lastVenueId: cur.lastVenueId,
      currentGameId,
      lastExportAt,
      games,
    });
  }

  return {
    SCHEMA_VERSION, APP_ID, MIN_ROSTER, MAX_ROSTER, VENUES, PALETTE,
    gameStats, playerHistory, listGames, latestFinishedGameId, percentileOf, recordFor, MIN_POOL,
    emptyState, migrate, makeId, shuffle,
    getVenue, getCourse, playableVenues, setVenue, distanceKm, nearestVenue,
    visiblePlayers, getPlayer, rosterPlayers,
    addPlayer, renamePlayer, hidePlayer, setRoster,
    getGame, getActiveGame, hasAnyScore, newGame,
    canRerollFirstOrder, rerollFirstOrder,
    firstOrderNames, firstOrderSentence,
    courseTotal, turnOrder, standings, cursor, upNext, recordScore,
    editScore, canUndo, canRedo, undo, redo,
    priorHoleInfo, courseResult, courseFilled,
    playoffState, playoffWinnerId, gamePhase, regulationSkips, replayQueued, cellValue,

  const POINTER_WINDOW_MS = 500; // a click this soon after a pointer press is the same tap
  const FLASH_MS = 1300;         // how long a tap's confirmation stays in the now-up bar

  const IOS_HINT_KEY = 'golfScorecard.iosHintDismissed';

  let state = Golf.emptyState();
  let screen = 'home';          // 'setup' | 'home' | 'scoring' | 'stats' | 'history' | 'abandoned' | 'export' | 'import'
  let viewGameId = null;        // the game the stats or abandoned screen shows (null = current)
  let backScreen = 'home';      // where the back link on the stats screen goes
  let historyTab = 'games';     // 'games' | 'players'
  let statsShownKey = null;     // the game whose stats screen has already played its confetti
  let blockedMessage = null;    // set when storage holds data this version cannot open
  let readOnly = false;         // when true nothing is written, so unreadable data is never overwritten
  let editingId = null;         // player being renamed in setup
  let setupError = '';
  let nearby = null;            // {venue, km} from this visit's location check, or null
  let venueTouched = false;     // the user picked a venue on the setup screen this visit
  let venueRequest = 0;         // bumped on each visit, so a late location answer is ignored
  let toastTimer = null;
  let scrollPending = false;    // scroll the cursor into view on the next scoring render
  let menuOpen = false;         // the ⋯ menu above the tools row
  let overrides = new Map();    // course index -> {status, open}: a manual expand or collapse
  let editing = null;           // {courseIndex, hole, playerId} while editing an earlier cell. Never saved.
  let lastScoreAt = 0;
  let lastPointerAt = 0;
  let wakeLock = null;
  let wakeLockPending = false;
  let importText = '';          // the import textarea, kept across renders
  let importPreview = null;     // Golf.parseImport result for the text, set by Preview
  let importMode = 'merge';     // 'merge' | 'replace'
  let corruptDismissed = null;  // a corrupt-data backup key the user dismissed this visit

  const $ = (sel) => document.querySelector(sel);
  const esc = (value) => String(value).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
  const cryptoRand = () => {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] / 4294967296;
  };
  const nowISO = () => new Date().toISOString();
  const formatTime = (iso) => {
    try {
      return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase();
    } catch (e) {
      return '';
    }
  };
  const nameOf = (id) => {
    const player = Golf.getPlayer(state, id);
    return player ? player.name : '?';
  };
  const formatPar = (v) => (v === 0 ? 'E' : (v > 0 ? `+${v}` : `-${Math.abs(v)}`));
  const valueLabel = (v) => (v === null ? '–' : (v === 'S' ? 'skip' : String(v)));

  // White or near-black text, whichever contrasts more with the background.
  const inkFor = (hex) => {
    const lin = (c) => {
      const x = c / 255;
      return x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4;
    };
    const n = parseInt(hex.slice(1), 16);
    const L = 0.2126 * lin((n >> 16) & 255) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
    const onWhite = 1.05 / (L + 0.05);
    const onBlack = (L + 0.05) / 0.05;
    return onWhite >= onBlack ? '#ffffff' : '#101412';

  // ---- clipboard (spec 9.4) --------------------------------------------------

  // Copies through a hidden textarea. Works where the async clipboard API is missing or refused.
  function legacyCopy(text) {
    const box = document.createElement('textarea');
    box.value = text;
    box.setAttribute('readonly', '');
    box.style.position = 'fixed';
    box.style.top = '0';
    box.style.left = '0';
    box.style.opacity = '0';
    box.style.fontSize = '16px';
    document.body.appendChild(box);
    box.focus();
    box.select();
    box.setSelectionRange(0, text.length);
    let ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    box.remove();
    return ok;
  }

  // Last resort: the text in a selectable box, for the user to copy by hand.
  function showCopyModal(text) {
    document.querySelector('#copy-modal')?.remove();
    const wrap = document.createElement('div');
    wrap.id = 'copy-modal';
    wrap.className = 'modal-backdrop';
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="copy-title">
        <h2 id="copy-title">Copy this text</h2>
        <p class="hint">This browser would not copy it for you. Tap the text, select all, and copy.</p>
        <textarea class="copy-box" readonly aria-label="Text to copy"></textarea>
        <button class="btn big primary" data-action="close-copy">Close</button>

    const box = wrap.querySelector('textarea');
    box.value = text;
    document.body.appendChild(wrap);
    box.focus();
    box.select();
  }

  // Resolves to 'copied' (the toast says so) or 'modal' (the text is on screen to copy).
  async function copyText(text) {

      if (navigator.clipboard && navigator.clipboard.writeText) {

        toast('Copied ✓');
        return 'copied';
      }
