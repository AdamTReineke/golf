<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Golf Scorecard</title>
<style>
  :root {
    --bg: #f5f7f5; --card: #ffffff; --fg: #14201a; --muted: #5a6a61; --line: #d6ded9;
    --accent: #1f7a4d; --accent-fg: #ffffff; --soft: #e6f1ea;
    --error: #b3261e; --amber: #e8a317;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101412; --card: #18201c; --fg: #e8efea; --muted: #9fb0a6; --line: #2d3a33;
      --accent: #4cc68a; --accent-fg: #0b1510; --soft: #1b3026;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    background: var(--bg); color: var(--fg);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; touch-action: manipulation;
  }
  .wrap {
    max-width: 520px; margin: 0 auto; box-sizing: border-box;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  h1 { font-size: 1.6rem; margin: 0; }
  h2 { font-size: 1.3rem; margin: 0 0 8px; }
  p { margin: 8px 0; }
  .top { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; flex-wrap: wrap; }
  .top .link { padding-left: 0; }
  .hint { color: var(--muted); font-size: .95rem; }
  .sub { display: block; font-size: .95rem; font-weight: 400; opacity: .9; margin-top: 2px; }
  .eyebrow { color: var(--muted); font-size: .9rem; margin: 0 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  .section-label { color: var(--muted); font-size: .9rem; margin: 20px 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
  .error { color: var(--error); font-weight: 600; }

  .btn {
    font: inherit; font-size: 18px; font-weight: 600; min-height: 56px; padding: 0 20px;
    border-radius: 14px; border: 2px solid var(--accent); background: var(--card); color: var(--accent);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.big { width: 100%; min-height: 72px; font-size: 22px; flex-direction: column; margin: 8px 0; }
  .btn.small { min-height: 44px; font-size: 16px; padding: 0 14px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .link {
    background: none; border: 0; color: var(--accent); font: inherit; font-size: 16px;
    min-height: 44px; padding: 10px 8px; cursor: pointer; text-decoration: underline;
  }
  .link.danger { color: var(--error); }

  .text {
    font: inherit; font-size: 18px; min-height: 52px; padding: 0 14px; flex: 1; min-width: 0;
    border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .add, .rename { display: flex; gap: 8px; align-items: center; margin: 8px 0; }

  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 4px; min-height: 56px; border-bottom: 1px solid var(--line); }
  .row .rename { margin: 8px 0; width: 100%; }
  .pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 56px; font-size: 19px; cursor: pointer; }
  .pick input { width: 26px; height: 26px; margin: 0; flex: none; accent-color: var(--accent); }
  .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }

  .playing {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    margin: 12px 0 4px; min-height: 52px; padding: 10px 14px; border-radius: 12px;
    background: var(--soft); color: var(--fg); border: 0; font: inherit; font-size: 17px; text-align: left; cursor: pointer;
  }
  .links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 16px; }
  .banner-order { font-size: 1.35rem; font-weight: 700; margin: 8px 0 12px; }

  .save-banner {
    position: sticky; top: 0; z-index: 5; background: var(--error); color: #ffffff;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; font-weight: 600;
  }
  .save-banner .btn { min-height: 44px; border-color: #ffffff; color: #ffffff; background: transparent; }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    margin: 0 auto; max-width: 480px; z-index: 10; padding: 12px 16px; border-radius: 12px;
    background: var(--fg); color: var(--bg); text-align: center; font-weight: 600;
  }

  /* ---- scoring screen (spec 4, 6.1) ---- */
  .scoring { --pc: var(--accent); --pi: var(--accent-fg); padding-bottom: calc(var(--dock-h, 300px) + 12px); }
  .banner-first {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: var(--soft); border-radius: 12px; padding: 8px 12px; margin: 4px 0 10px; font-size: 16px;
  }
  .banner-first .link { min-height: 40px; padding: 0 4px; }
  .now {
    position: sticky; top: 0; z-index: 4; background: var(--pc); color: var(--pi);
    border-radius: 14px; padding: 10px 14px; margin: 0 0 12px; box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
  }
  .now .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 600; }
  .now .meta.next { justify-content: flex-end; font-weight: 500; opacity: .92; font-size: 14px; }
  .now .who { font-size: 30px; font-weight: 800; line-height: 1.15; margin: 4px 0; overflow-wrap: anywhere; }
  .course { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 0 0 12px; overflow: hidden; }
  .course-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 44px;
    font: inherit; font-size: 16px; font-weight: 700; color: var(--fg); text-align: left;
    background: color-mix(in srgb, var(--fg) 8%, var(--card)); border: 0; padding: 8px 12px; cursor: pointer;
  }
  .course-head.static { cursor: default; }
  .course-head span:last-child { color: var(--muted); font-size: 14px; font-weight: 600; }
  .sheet { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 17px; font-variant-numeric: tabular-nums; }
  .sheet th, .sheet td { border-top: 1px solid var(--line); padding: 6px 2px; text-align: center; overflow: hidden; }
  .sheet thead th { font-size: 13px; font-weight: 600; color: var(--muted); padding: 6px 2px 4px; vertical-align: bottom; }
  .sheet tbody th, .sheet tfoot th { width: 34px; color: var(--muted); font-weight: 600; font-size: 14px; }
  .sheet td { height: 40px; }
  .sheet tfoot th, .sheet tfoot td { font-weight: 800; color: var(--fg); border-top: 2px solid var(--line); }
  .sheet .pn { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); font-size: 15px; font-weight: 700; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%;
    background: var(--fg); color: var(--bg); font-size: 11px; font-weight: 800; margin-bottom: 2px;
  }
  .sheet tr.now-row th, .sheet tr.now-row td { background: color-mix(in srgb, var(--pc) 16%, transparent); }
  .sheet td.cur { outline: 2px solid var(--pc); outline-offset: -2px; font-weight: 800; background: color-mix(in srgb, var(--pc) 28%, transparent); }
  .sheet td[data-cell] { cursor: pointer; }
  .sheet td.editing { outline: 3px solid var(--amber); outline-offset: -3px; font-weight: 800; background: color-mix(in srgb, var(--amber) 28%, transparent); }
  .now.editing { background: var(--amber); color: #14201a; cursor: pointer; }
  .now.editing .who { font-size: 26px; }
  .dock {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 6;
    width: 100%; max-width: 520px; background: var(--bg); border-top: 1px solid var(--line);
    box-shadow: 0 -4px 14px rgba(0, 0, 0, .10);
    padding: 8px max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key {
    min-height: 64px; border: 0; border-radius: 12px; background: var(--pc); color: var(--pi);
    font: inherit; font-size: 26px; font-weight: 800; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .key.s { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--pi) 50%, transparent); }
  .tools { display: flex; gap: 8px; margin-top: 8px; }
  .tool {
    flex: 1; min-height: 44px; font: inherit; font-size: 16px; color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
  }
  .tool:disabled { opacity: .45; cursor: default; }
  .tool.menu-btn { flex: 0 0 64px; font-size: 22px; }
  .menu { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  body.scoring .toast { bottom: calc(var(--dock-h, 300px) + 12px); }
</style>
</head>
<body>
<div id="save-banner" class="save-banner" role="alert" hidden>
  <span>Scores are not being saved.</span>
  <button class="btn small" data-action="export">Export</button>
</div>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" role="status" hidden></div>

<script id="logic">
/*
 * Pure logic. No DOM, no localStorage, no window. Runs unmodified in Node.
 * Every mutator takes a state and returns a NEW state; inputs are never modified.
 * Randomness is injected as rand(): a function returning a float in [0, 1).
 *
 * Scoring (step 2): turn order and the cursor are derived from the scores, never
 * stored. Undo/redo and cell edits (step 3) live on the game as action stacks.
 * Step 4 adds playoffs, step 5 stats and replay.
 */
const Golf = (() => {
  const SCHEMA_VERSION = 1;
  const MIN_ROSTER = 1;
  const MAX_ROSTER = 6;

  // Spec section 2. Changing a course id breaks its history: ids are permanent.
  const VENUES = [{
    id: 'redmond', name: 'Redmond',
    courses: [
      { id: 'redmond-mini', name: 'Mini Golf', holes: 9, par: [3, 3, 3, 3, 3, 3, 3, 3, 3],
        lowerIsBetter: true, keys: [1, 2, 3, 4, 5, 6, 7, 8] },
      { id: 'redmond-aces', name: 'Aces', holes: 8, par: null,
        lowerIsBetter: true, keys: [1, 2, 3, 4, 5, 6, 7, 8] },
      { id: 'redmond-duff', name: 'Duffleboard', holes: 9, par: null,
        lowerIsBetter: true, keys: [1, 2, 3, 4, 5, 6, 7, 8] },
    ],
  }];

  // Eight distinct colors that read on both light and dark backgrounds.
  const PALETTE = ['#d1495b', '#2d7ff9', '#2f9e44', '#e8a317', '#7048e8', '#0ca3a3', '#e64980', '#495057'];

  function deepFreeze(value) {
    if (value && typeof value === 'object') {
      Object.values(value).forEach(deepFreeze);
      Object.freeze(value);
    }
    return value;
  }
  deepFreeze(VENUES);
  deepFreeze(PALETTE);

  const clone = (value) => JSON.parse(JSON.stringify(value));

  // ---- ids and randomness ----------------------------------------------------

  // 128 random bits drawn from rand(), formatted as hex with a prefix.
  function makeId(prefix, rand = Math.random) {
    let hex = '';
    for (let i = 0; i < 32; i += 1) hex += Math.floor(rand() * 16).toString(16);
    return `${prefix}_${hex}`;
  }

  // Fisher-Yates over a copy. Returns a new array.
  function shuffle(items, rand = Math.random) {
    const out = items.slice();
    for (let i = out.length - 1; i > 0; i -= 1) {
      const j = Math.floor(rand() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  // ---- state and migration ---------------------------------------------------

  function emptyState() {
    return {
      schemaVersion: SCHEMA_VERSION,
      players: [],
      lastRoster: [],
      currentGameId: null,
      lastExportAt: null,
      games: [],
    };
  }

  // MIGRATIONS[n] upgrades a state from schemaVersion n to n + 1.
  // None yet: version 1 is the first version.
  const MIGRATIONS = {};

  function normalize(state) {
    return Object.assign({}, state, {
      schemaVersion: SCHEMA_VERSION,
      players: Array.isArray(state.players) ? state.players : [],
      lastRoster: Array.isArray(state.lastRoster) ? state.lastRoster : [],
      currentGameId: typeof state.currentGameId === 'string' ? state.currentGameId : null,
      lastExportAt: typeof state.lastExportAt === 'string' ? state.lastExportAt : null,
      games: Array.isArray(state.games) ? state.games : [],
    });
  }

  // Returns a current-version state. Throws on unreadable data. Newer data
  // throws with err.code === 'NEWER_SCHEMA' so the UI can refuse to overwrite it.
  function migrate(raw) {
    if (raw === null || raw === undefined) return emptyState();
    if (typeof raw !== 'object' || Array.isArray(raw)) throw new Error('Saved data is not an object.');
    let version = raw.schemaVersion;
    if (!Number.isInteger(version) || version < 1) throw new Error('Saved data has no valid schemaVersion.');
    if (version > SCHEMA_VERSION) {
      const err = new Error(`Saved data is from a newer version of this app (schemaVersion ${version}). Update the app to open it.`);
      err.code = 'NEWER_SCHEMA';
      throw err;
    }
    let state = clone(raw);
    while (version < SCHEMA_VERSION) {
      state = MIGRATIONS[version](state);
      version += 1;
    }
    return normalize(state);
  }

  // ---- venues and courses ----------------------------------------------------

  function defaultVenue() { return VENUES[0]; }

  function getVenue(venueId) {
    return VENUES.find((v) => v.id === venueId) || null;
  }

  function getCourse(courseId) {
    for (const venue of VENUES) {
      const course = venue.courses.find((c) => c.id === courseId);
      if (course) return course;
    }
    return null;
  }

  // ---- players ---------------------------------------------------------------

  function visiblePlayers(state) {
    return state.players.filter((p) => !p.hidden);
  }

  function getPlayer(state, id) {
    return state.players.find((p) => p.id === id) || null;
  }

  // Today's roster as player objects, in roster (column) order.
  function rosterPlayers(state) {
    return state.lastRoster
      .map((id) => getPlayer(state, id))
      .filter((p) => p && !p.hidden);
  }

  function normalizeName(name) {
    const trimmed = typeof name === 'string' ? name.trim() : '';
    if (trimmed === '') throw new Error('Name cannot be empty.');
    return trimmed;
  }

  // Uniqueness is checked among visible players, case-insensitively.
  function nameTaken(state, name, exceptId = null) {
    const lower = name.toLowerCase();
    return visiblePlayers(state).some((p) => p.id !== exceptId && p.name.toLowerCase() === lower);
  }

  // First palette color no visible player uses; falls back to cycling.
  function pickColor(state) {
    const used = new Set(visiblePlayers(state).map((p) => p.color));
    return PALETTE.find((c) => !used.has(c)) || PALETTE[state.players.length % PALETTE.length];
  }

  function addPlayer(state, name, rand = Math.random, now = null) {
    const clean = normalizeName(name);
    if (nameTaken(state, clean)) throw new Error(`"${clean}" is already in the player list.`);
    const next = clone(state);
    next.players.push({
      id: makeId('p', rand),
      name: clean,
      color: pickColor(state),
      hidden: false,
      createdAt: now,
    });
    return next;
  }

  function renamePlayer(state, id, name) {
    const clean = normalizeName(name);
    const player = getPlayer(state, id);
    if (!player || player.hidden) throw new Error('That player is not in the list.');
    if (nameTaken(state, clean, id)) throw new Error(`"${clean}" is already in the player list.`);
    const next = clone(state);
    getPlayer(next, id).name = clean;
    return next;
  }

  // Soft delete: history and games are kept; the player leaves today's roster.
  function hidePlayer(state, id) {
    if (!getPlayer(state, id)) throw new Error('That player is not in the list.');
    const next = clone(state);
    getPlayer(next, id).hidden = true;
    next.lastRoster = next.lastRoster.filter((x) => x !== id);
    return next;
  }

  function requireVisible(state, id) {
    const player = getPlayer(state, id);
    if (!player || player.hidden) throw new Error('That player is not in the list.');
    return player;
  }

  function validateRoster(state, ids) {
    if (!Array.isArray(ids) || ids.length < MIN_ROSTER || ids.length > MAX_ROSTER) {
      throw new Error(`Choose between ${MIN_ROSTER} and ${MAX_ROSTER} players.`);
    }
    if (new Set(ids).size !== ids.length) throw new Error('A player can only be picked once.');
    ids.forEach((id) => requireVisible(state, id));
  }

  // "Playing today". Saved so the next New game reuses it.
  function setRoster(state, ids) {
    validateRoster(state, ids);
    const next = clone(state);
    next.lastRoster = ids.slice();
    return next;
  }

  // ---- games -----------------------------------------------------------------

  function getGame(state, gameId) {
    return state.games.find((g) => g.id === gameId) || null;
  }

  function getActiveGame(state) {
    const game = getGame(state, state.currentGameId);
    return game && game.status === 'active' ? game : null;
  }

  function hasAnyScore(game) {
    return game.courses.some((c) => !!c.playoff
      || Object.values(c.scores).some((arr) => arr.some((v) => v !== null)));
  }

  // Creates an active game from lastRoster. Any previously active game becomes
  // 'abandoned'. The caller decides whether to confirm first.
  function newGame(state, rand = Math.random, now = null) {
    const venue = defaultVenue();
    const roster = state.lastRoster.slice();
    validateRoster(state, roster);
    const game = {
      id: makeId('g', rand),
      venueId: venue.id,
      status: 'active',
      startedAt: now,
      finishedAt: null,
      playerIds: roster,
      firstOrder: shuffle(roster, rand),
      courses: venue.courses.map((course) => ({
        courseId: course.id,
        scores: Object.fromEntries(roster.map((id) => [id, new Array(course.holes).fill(null)])),
        playoff: null,
      })),
      replayQueue: null,
      undo: [],
      redo: [],
    };
    const next = clone(state);
    next.games.forEach((g) => { if (g.status === 'active') g.status = 'abandoned'; });
    next.games.push(game);
    next.currentGameId = game.id;
    return next;
  }

  function canRerollFirstOrder(game) {
    return !hasAnyScore(game);
  }

  function rerollFirstOrder(state, gameId, rand = Math.random) {
    const game = getGame(state, gameId);
    if (!game || game.status !== 'active') throw new Error('No active game to re-roll.');
    if (!canRerollFirstOrder(game)) throw new Error('The order can only be re-rolled before the first score.');
    const next = clone(state);
    getGame(next, gameId).firstOrder = shuffle(game.playerIds, rand);
    return next;
  }

  function firstOrderNames(state, game) {
    return game.firstOrder.map((id) => (getPlayer(state, id) || { name: '?' }).name);
  }

  // "Sam goes first, then Adam, Jo"
  function firstOrderSentence(state, game) {
    const [first, ...rest] = firstOrderNames(state, game);
    if (!first) return '';
    if (rest.length === 0) return `${first} goes first`;
    return `${first} goes first, then ${rest.join(', ')}`;
  }

  // ---- scores, totals and course results (spec 4, 5, 6.2) -------------------
  // A cell is null (not entered), 'S' (skipped) or a number from the course keys.

  const isNumber = (v) => typeof v === 'number';

  // Stable sort of ids. keyOf(id) returns [group, value]; lower sorts first.
  function sortStable(ids, keyOf) {
    return ids
      .map((id, pos) => ({ id, pos, key: keyOf(id) }))
      .sort((a, b) => (a.key[0] - b.key[0]) || (a.key[1] - b.key[1]) || (a.pos - b.pos))
      .map((x) => x.id);
  }

  // Totals for one player on one course. Skips add nothing; a skip or an
  // unentered hole makes the card incomplete. vsPar covers the entered holes.
  function courseTotal(game, ci, pid) {
    const course = getCourse(game.courses[ci].courseId);
    const row = game.courses[ci].scores[pid];
    let total = 0;
    let skips = 0;
    let parSoFar = 0;
    let allEntered = true;
    row.forEach((v, h) => {
      if (isNumber(v)) {
        total += v;
        if (course.par) parSoFar += course.par[h];
      } else {
        allEntered = false;
        if (v === 'S') skips += 1;
      }
    });
    return {
      total,
      skips,
      complete: allEntered && skips === 0,
      vsPar: course.par ? total - parSoFar : null,
    };
  }

  // STEP 4 HOOK: returns the id of the player who won this course's playoff, or null.
  // standings() puts that player first when they are among the tied leaders.
  function playoffWinnerId(game, ci) { // eslint-disable-line no-unused-vars
    return null;
  }

  // Final standings of a course: complete cards first, then by total, then by the
  // course's last-hole order (ties stay stable).
  function standings(game, ci) {
    const course = getCourse(game.courses[ci].courseId);
    const dir = course.lowerIsBetter ? 1 : -1;
    const totals = new Map(game.playerIds.map((id) => [id, courseTotal(game, ci, id)]));
    const lastOrder = courseOrders(game, ci).slice(-1)[0];
    let order = sortStable(lastOrder, (id) => {
      const t = totals.get(id);
      return [t.complete ? 0 : 1, dir * t.total];
    });
    const winnerId = playoffWinnerId(game, ci);
    const lead = totals.get(order[0]);
    if (winnerId && lead && lead.complete && totals.get(winnerId).complete
      && totals.get(winnerId).total === lead.total) {
      order = [winnerId, ...order.filter((id) => id !== winnerId)];
    }
    return order;
  }

  // Play order for every hole of a course, index h-1.
  // Hole 1: firstOrder for the first course, otherwise the previous course's standings.
  // Hole h: players sorted by their score on hole h-1 (best first, S and blanks last),
  // stable relative to the order they had on hole h-1.
  function courseOrders(game, ci) {
    const course = getCourse(game.courses[ci].courseId);
    const scores = game.courses[ci].scores;
    const dir = course.lowerIsBetter ? 1 : -1;
    let order = ci === 0 ? game.firstOrder.slice() : standings(game, ci - 1);
    const orders = [order];
    for (let h = 2; h <= course.holes; h += 1) {
      const idx = h - 2;
      order = sortStable(order, (id) => {
        const v = scores[id][idx];
        return isNumber(v) ? [0, dir * v] : [1, 0];
      });
      orders.push(order);
    }
    return orders;
  }

  function turnOrder(game, courseIndex, hole) {
    const orders = courseOrders(game, courseIndex);
    if (!orders[hole - 1]) throw new Error(`No hole ${hole} on course ${courseIndex}.`);
    return orders[hole - 1].slice();
  }

  // Every regulation cell in play order: {courseIndex, hole, playerId}.
  function playOrder(game) {
    const cells = [];
    game.courses.forEach((_, ci) => {
      courseOrders(game, ci).forEach((order, h) => {
        order.forEach((playerId) => cells.push({ courseIndex: ci, hole: h + 1, playerId }));
      });
    });
    return cells;
  }

  // DERIVED, never stored: the first empty cell in play order, or null when every
  // regulation cell is filled. STEP 4 HOOK: a pending playoff takes priority.
  function cursor(game) {
    const cell = playOrder(game).find((c) => game.courses[c.courseIndex].scores[c.playerId][c.hole - 1] === null);
    return cell || null;
  }

  // The player after the cursor in play order (for "next: Jo"), or null.
  function upNext(game, cur) {
    if (!cur) return null;
    const cells = playOrder(game);
    const idx = cells.findIndex((c) => c.courseIndex === cur.courseIndex
      && c.hole === cur.hole && c.playerId === cur.playerId);
    return idx >= 0 && cells[idx + 1] ? cells[idx + 1].playerId : null;
  }

  // ---- recording, editing, undo and redo (spec 6.3, 6.4) ----------------------
  // An action is {type:'set', courseIndex, hole, playerId, prev, next}. Undo writes
  // prev back into the cell, redo writes next. STEP 4 HOOK: playoff cells will add
  // playoff: true, and writeCell() routes those to courses[ci].playoff.scores.

  // Writes value into the cell an action points at.
  function writeCell(game, action, value) {
    game.courses[action.courseIndex].scores[action.playerId][action.hole - 1] = value;
  }

  // Keeps status in line with the cells: an active game with no empty cell finishes,
  // and a finished game with an empty cell (after an undo) becomes active again.
  function syncStatus(game, now) {
    const open = cursor(game) !== null;
    if (game.status === 'active' && !open) {
      game.status = 'finished';
      game.finishedAt = now;
    } else if (game.status === 'finished' && open) {
      game.status = 'active';
      game.finishedAt = null;
    }
  }

  // Records one score at the cursor. value is one of the course keys or 'S'.
  // Returns a new state. When the last regulation cell is filled the game finishes.
  function recordScore(state, gameId, value, now = null) {
    const game = getGame(state, gameId);
    if (!game || game.status !== 'active') throw new Error('No active game to score.');
    const cur = cursor(game);
    if (!cur) throw new Error('Every hole is already scored.');
    const course = getCourse(game.courses[cur.courseIndex].courseId);
    if (!(value === 'S' || course.keys.includes(value))) {
      throw new Error(`Score must be one of ${course.keys.join(', ')} or S.`);
    }
    const next = clone(state);
    const target = getGame(next, gameId);
    const action = {
      type: 'set',
      courseIndex: cur.courseIndex,
      hole: cur.hole,
      playerId: cur.playerId,
      prev: null,
      next: value,
    };
    writeCell(target, action, value);
    target.undo.push(action);
    target.redo = [];
    syncStatus(target, now);
    return next;
  }

  // Overwrites a FILLED cell of an active game (spec 6.4). Undoable. Returns a new state.
  function editScore(state, gameId, courseIndex, hole, playerId, value) {
    const game = getGame(state, gameId);
    if (!game || game.status !== 'active') throw new Error('No active game to edit.');
    const entry = game.courses[courseIndex];
    const row = entry ? entry.scores[playerId] : null;
    if (!Array.isArray(row) || !Number.isInteger(hole) || hole < 1 || hole > row.length) {
      throw new Error('That cell is not on the card.');
    }
    const prev = row[hole - 1];
    if (prev === null) throw new Error('Only a filled cell can be edited.');
    const course = getCourse(entry.courseId);
    if (!(value === 'S' || course.keys.includes(value))) {
      throw new Error(`Score must be one of ${course.keys.join(', ')} or S.`);
    }
    const next = clone(state);
    const target = getGame(next, gameId);
    const action = { type: 'set', courseIndex, hole, playerId, prev, next: value };
    writeCell(target, action, value);
    target.undo.push(action);
    target.redo = [];
    return next;
  }

  // Undo and redo work on active and finished games, so a finished game can be reopened.
  function canUndo(state, gameId) {
    const game = getGame(state, gameId);
    return !!game && (game.status === 'active' || game.status === 'finished') && game.undo.length > 0;
  }

  function canRedo(state, gameId) {
    const game = getGame(state, gameId);
    return !!game && (game.status === 'active' || game.status === 'finished') && game.redo.length > 0;
  }

  // Restores the previous value of the last action. A finished game with an empty cell reopens.
  function undo(state, gameId) {
    if (!canUndo(state, gameId)) throw new Error('Nothing to undo.');
    const next = clone(state);
    const game = getGame(next, gameId);
    const action = game.undo.pop();
    writeCell(game, action, action.prev);
    game.redo.push(action);
    syncStatus(game, null);
    return next;
  }

  // Re-applies the last undone action. If it fills the last cell, the game finishes at now.
  function redo(state, gameId, now = null) {
    if (!canRedo(state, gameId)) throw new Error('Nothing to redo.');
    const next = clone(state);
    const game = getGame(next, gameId);
    const action = game.redo.pop();
    writeCell(game, action, action.next);
    game.undo.push(action);
    syncStatus(game, now);
    return next;
  }

  // What the now-up bar shows as the prior score: the player's previous hole on
  // this course, or on hole 1 of courses 2+ the previous course's total.
  function priorHoleInfo(game, cur) {
    if (!cur) return null;
    const { courseIndex: ci, hole, playerId } = cur;
    if (hole > 1) {
      return { kind: 'hole', label: `Hole ${hole - 1}`, score: game.courses[ci].scores[playerId][hole - 2] };
    }
    if (ci === 0) return null;
    const prevCourse = getCourse(game.courses[ci - 1].courseId);
    const t = courseTotal(game, ci - 1, playerId);
    return {
      kind: 'course', label: prevCourse.name, total: t.total, skips: t.skips, complete: t.complete, vsPar: t.vsPar,
    };
  }

  // Winner of a course: exactly one complete player with the lowest total wins.
  // Otherwise winnerId is null and leaders lists the tied players.
  function courseResult(game, ci) {
    const course = getCourse(game.courses[ci].courseId);
    const pick = course.lowerIsBetter ? Math.min : Math.max;
    const rows = game.playerIds.map((id) => ({ id, ...courseTotal(game, ci, id) })).filter((r) => r.complete);
    if (rows.length === 0) {
      return { winnerId: null, leaders: [], total: null, runnerUpTotal: null, tied: false };
    }
    const best = pick(...rows.map((r) => r.total));
    const leaders = rows.filter((r) => r.total === best).map((r) => r.id);
    const others = rows.filter((r) => r.total !== best).map((r) => r.total);
    return {
      winnerId: leaders.length === 1 ? leaders[0] : null,
      leaders,
      total: best,
      runnerUpTotal: others.length ? pick(...others) : null,
      tied: leaders.length > 1,
    };
  }

  // True when every cell of course ci is filled (skips count as filled).
  function courseFilled(game, ci) {
    return game.playerIds.every((id) => game.courses[ci].scores[id].every((v) => v !== null));
  }

  return {
    SCHEMA_VERSION, MIN_ROSTER, MAX_ROSTER, VENUES, PALETTE,
    emptyState, migrate, makeId, shuffle,
    getVenue, getCourse,
    visiblePlayers, getPlayer, rosterPlayers,
    addPlayer, renamePlayer, hidePlayer, setRoster,
    getGame, getActiveGame, hasAnyScore, newGame,
    canRerollFirstOrder, rerollFirstOrder,
    firstOrderNames, firstOrderSentence,
    courseTotal, turnOrder, standings, cursor, upNext, recordScore,
    editScore, canUndo, canRedo, undo, redo,
    priorHoleInfo, courseResult, courseFilled,
  };
})();
</script>

<script id="ui">
(() => {
  'use strict';

  const STORAGE_KEY = 'golfScorecard.v1';
  const CORRUPT_PREFIX = 'golfScorecard.corrupt.';
  const FAT_FINGER_MS = 250;     // spec 6.1: ignore taps right after a score
  const POINTER_WINDOW_MS = 500; // a click this soon after a pointer press is the same tap

  let state = Golf.emptyState();
  let screen = 'home';          // 'setup' | 'home' | 'scoring' | 'over'
  let blockedMessage = null;    // set when storage holds data this version cannot open
  let readOnly = false;         // when true nothing is written, so unreadable data is never overwritten
  let editingId = null;         // player being renamed in setup
  let setupError = '';
  let toastTimer = null;
  let scrollPending = false;    // scroll the cursor into view on the next scoring render
  let menuOpen = false;         // the ⋯ menu above the tools row
  let overrides = new Map();    // course index -> {status, open}: a manual expand or collapse
  let editing = null;           // {courseIndex, hole, playerId} while editing an earlier cell. Never saved.
  let lastScoreAt = 0;
  let lastPointerAt = 0;
  let wakeLock = null;
  let wakeLockPending = false;

  const $ = (sel) => document.querySelector(sel);
  const esc = (value) => String(value).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
  const cryptoRand = () => {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] / 4294967296;
  };
  const nowISO = () => new Date().toISOString();
  const formatTime = (iso) => {
    try {
      return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase();
    } catch (e) {
      return '';
    }
  };
  const nameOf = (id) => {
    const player = Golf.getPlayer(state, id);
    return player ? player.name : '?';
  };
  const formatPar = (v) => (v === 0 ? 'E' : (v > 0 ? `+${v}` : `-${Math.abs(v)}`));
  const valueLabel = (v) => (v === null ? '–' : (v === 'S' ? 'skip' : String(v)));

  // White or near-black text, whichever contrasts more with the background.
  const inkFor = (hex) => {
    const lin = (c) => {
      const x = c / 255;
      return x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4;
    };
    const n = parseInt(hex.slice(1), 16);
    const L = 0.2126 * lin((n >> 16) & 255) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
    const onWhite = 1.05 / (L + 0.05);
    const onBlack = (L + 0.05) / 0.05;
    return onWhite >= onBlack ? '#ffffff' : '#101412';
  };

  // ---- toast and save banner -------------------------------------------------

  function toast(message) {
    const el = $('#toast');
    el.textContent = message;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
  }

  function setSaveBanner(show) {
    $('#save-banner').hidden = !show;
  }

  // ---- storage ---------------------------------------------------------------

  function writeState(next) {
    if (readOnly) return false;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      setSaveBanner(false);
      return true;
    } catch (e) {
      setSaveBanner(true);
      return false;
    }
  }

  // Moves unreadable raw text to a timestamped key and starts fresh.
  function recoverCorrupt(raw) {
    const key = CORRUPT_PREFIX + Date.now();
    try {
      localStorage.setItem(key, raw);
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) {
      // Could not back it up, so do not overwrite it.
      readOnly = true;
      setSaveBanner(true);
      return Golf.emptyState();
    }
    const fresh = Golf.emptyState();
    writeState(fresh);
    toast(`Saved data was unreadable and was moved to ${key}.`);
    return fresh;
  }

  function loadState() {
    blockedMessage = null;
    readOnly = false;
    let raw;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      setSaveBanner(true);
      return Golf.emptyState();
    }
    if (raw === null) return Golf.emptyState();
    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      return recoverCorrupt(raw);
    }
    try {
      return Golf.migrate(parsed);
    } catch (e) {
      if (e.code === 'NEWER_SCHEMA') {
        blockedMessage = e.message;
        readOnly = true;
        return Golf.emptyState();
      }
      return recoverCorrupt(raw);
    }
  }

  // Applies a new state, saves it, and optionally switches screen.
  function commit(next, nextScreen = null) {
    state = next;
    writeState(state);
    if (nextScreen) screen = nextScreen;
    setupError = '';
    render();
  }

  function go(name) {
    screen = name;
    setupError = '';
    menuOpen = false;
    editing = null;
    if (name === 'scoring') scrollPending = true;
    render();
    if (name !== 'scoring') window.scrollTo(0, 0);
  }

  // ---- wake lock (spec 11) ---------------------------------------------------

  async function keepAwake() {
    if (!('wakeLock' in navigator) || wakeLockPending) return;
    if (wakeLock && !wakeLock.released) return;
    wakeLockPending = true;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      if (screen !== 'scoring') releaseAwake();
    } catch (e) {
      // Denied, or not available right now. Scoring still works without it.
    } finally {
      wakeLockPending = false;
    }
  }

  function releaseAwake() {
    const lock = wakeLock;
    wakeLock = null;
    try {
      if (lock) Promise.resolve(lock.release()).catch(() => {});
    } catch (e) {
      // Already released.
    }
  }

  // ---- scoring helpers -------------------------------------------------------

  // 'todo' (no cell entered), 'active' (partly entered), 'done' (every cell filled).
  function courseStatus(game, ci, cur) {
    const entry = game.courses[ci];
    const started = game.playerIds.some((id) => entry.scores[id].some((v) => v !== null));
    if (!started && !(cur && cur.courseIndex === ci)) return 'todo';
    return Golf.courseFilled(game, ci) ? 'done' : 'active';
  }

  // Active courses are open and finished ones are collapsed, until the user toggles one.
  function cardOpen(ci, status) {
    if (status === 'todo') return false;
    const ov = overrides.get(ci);
    if (ov && ov.status === status) return ov.open;
    return status === 'active';
  }

  function priorLabel(prior) {
    if (!prior) return '';
    if (prior.kind === 'hole') return `${prior.label}: ${prior.score === null ? '–' : prior.score}`;
    return `${prior.label}: ${prior.total}${prior.skips ? '*' : ''}`;
  }

  // Toast text when a course is finished. Uses the stored state, so the next course is known.
  function courseMessage(game, ci) {
    const course = Golf.getCourse(game.courses[ci].courseId);
    const r = Golf.courseResult(game, ci);
    const nextEntry = game.courses[ci + 1];
    const nextName = nextEntry ? Golf.getCourse(nextEntry.courseId).name : null;
    let core;
    if (r.winnerId) {
      const gap = r.runnerUpTotal !== null ? ` – ${r.runnerUpTotal}` : '';
      core = `${course.name}: ${nameOf(r.winnerId)} wins, ${r.total}${gap}`;
    } else if (r.tied) {
      core = `${course.name}: tied for first at ${r.total}`;
    } else {
      core = `${course.name}: no winner (skips)`;
    }
    return nextName ? `${core}. ${nextName} next` : core;
  }

  // ---- views -----------------------------------------------------------------

  function summary(game) {
    const cur = Golf.cursor(game);
    const course = cur ? Golf.getCourse(game.courses[cur.courseIndex].courseId) : null;
    const parts = [course ? `${course.name}, hole ${cur.hole}` : 'Game complete'];
    if (game.startedAt) parts.push(`started ${formatTime(game.startedAt)}`);
    return parts.join(' · ');
  }

  function viewHome() {
    const active = Golf.getActiveGame(state);
    const names = Golf.rosterPlayers(state).map((p) => esc(p.name));
    const playingLine = names.length ? `Playing: ${names.join(', ')}` : 'Add players to start';
    const resume = active
      ? `<button class="btn big primary" data-action="resume">Resume game<span class="sub">${esc(summary(active))}</span></button>`
      : '';
    return `
      <header class="top"><h1>Golf Scorecard</h1></header>
      ${resume}
      <button class="btn ${active ? '' : 'big primary'}" data-action="new">New game</button>
      <button class="playing" data-action="players"><span>${playingLine}</span><span aria-hidden="true">›</span></button>
      <nav class="links">
        <button class="link" data-action="soon">History</button>
        <button class="link" data-action="players">Players</button>
        <button class="link" data-action="soon">Export all data</button>
        <button class="link" data-action="soon">Import data</button>
      </nav>`;
  }

  function viewSetup() {
    const roster = new Set(state.lastRoster);
    const full = roster.size >= Golf.MAX_ROSTER;
    const active = Golf.getActiveGame(state);
    const players = Golf.visiblePlayers(state);
    const rows = players.map((p) => {
      const id = esc(p.id);
      if (editingId === p.id) {
        return `<li class="row">
          <form class="rename" data-form="rename" data-id="${id}">
            <input class="text" name="name" maxlength="24" value="${esc(p.name)}" aria-label="New name">
            <button class="btn small primary">Save</button>
            <button type="button" class="btn small" data-action="cancel-edit">Cancel</button>
          </form>
        </li>`;
      }
      const checked = roster.has(p.id);
      const disabled = !checked && full ? 'disabled' : '';
      return `<li class="row">
        <label class="pick">
          <input type="checkbox" data-action="toggle" data-id="${id}" ${checked ? 'checked' : ''} ${disabled}>
          <span class="dot" style="background:${esc(p.color)}"></span>
          <span class="pname">${esc(p.name)}</span>
        </label>
        <button class="link" data-action="edit" data-id="${id}">Rename</button>
        <button class="link danger" data-action="remove" data-id="${id}">Remove</button>
      </li>`;
    }).join('');
    return `
      <header class="top"><button class="link" data-action="home">&larr; Home</button><h1>Players</h1></header>
      <form class="add" data-form="add">
        <input class="text" name="name" maxlength="24" placeholder="Add a player" autocomplete="off" autocapitalize="words" aria-label="Player name">
        <button class="btn primary">Add</button>
      </form>
      ${setupError ? `<p class="error" role="alert">${esc(setupError)}</p>` : ''}
      <p class="section-label">Playing today: ${roster.size} of ${Golf.MAX_ROSTER}</p>
      <ul class="list">${rows}</ul>
      ${players.length ? '' : '<p class="hint">No players yet. Add the people playing today.</p>'}
      <button class="btn big primary" data-action="start" ${roster.size < Golf.MIN_ROSTER ? 'disabled' : ''}>${active ? 'Start new game' : 'Start game'}</button>
      <p class="hint">Starting a game shuffles the hole 1 order.</p>`;
  }

  function renderCard(game, ci, cur) {
    const entry = game.courses[ci];
    const course = Golf.getCourse(entry.courseId);
    const status = courseStatus(game, ci, cur);
    const parTotal = course.par ? course.par.reduce((a, b) => a + b, 0) : null;
    const meta = parTotal !== null ? `par ${parTotal}` : `${course.holes} holes`;
    const inner = `<span>${esc(course.name)}</span><span>${meta}</span>`;
    if (status === 'todo') {
      return `<section class="course todo"><div class="course-head static">${inner}</div></section>`;
    }
    const open = cardOpen(ci, status);
    const here = !!cur && cur.courseIndex === ci;
    const order = here ? Golf.turnOrder(game, ci, cur.hole) : null;
    const head = `<button class="course-head" data-action="toggle-card" data-ci="${ci}" aria-expanded="${open}">${inner}</button>`;
    const names = game.playerIds.map((id) => {
      const badge = order ? `<span class="badge">${order.indexOf(id) + 1}</span>` : '';
      return `<th scope="col">${badge}<span class="pn">${esc(nameOf(id))}</span></th>`;
    }).join('');
    let body = '';
    if (open) {
      for (let h = 1; h <= course.holes; h += 1) {
        const isNow = here && cur.hole === h;
        const cells = game.playerIds.map((id) => {
          const v = entry.scores[id][h - 1];
          const isCur = isNow && cur.playerId === id;
          const isEdit = !!editing && editing.courseIndex === ci && editing.hole === h && editing.playerId === id;
          const cls = [isCur ? 'cur' : '', isEdit ? 'editing' : ''].filter(Boolean).join(' ');
          const cellAttrs = v === null ? '' : ` data-cell data-ci="${ci}" data-h="${h}" data-pid="${esc(id)}"`;
          return `<td class="${cls}"${cellAttrs}>${v === null ? '' : esc(v)}</td>`;
        }).join('');
        body += `<tr class="${isNow ? 'now-row' : ''}"><th scope="row">${h}</th>${cells}</tr>`;
      }
    }
    const totals = game.playerIds.map((id) => {
      const t = Golf.courseTotal(game, ci, id);
      return `<td>${t.total}${t.skips ? '*' : ''}</td>`;
    }).join('');
    return `<section class="course ${status}">${head}
      <table class="sheet">
        <thead><tr><th scope="col">#</th>${names}</tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr><th scope="row">Tot</th>${totals}</tr></tfoot>
      </table>
    </section>`;
  }

  // The bar in edit mode (spec 6.4): amber, names the cell, and tapping it cancels.
  function editBar(game) {
    const { courseIndex: ci, hole, playerId } = editing;
    const course = Golf.getCourse(game.courses[ci].courseId);
    const t = Golf.courseTotal(game, ci, playerId);
    const was = game.courses[ci].scores[playerId][hole - 1];
    const par = course.par ? course.par[hole - 1] : null;
    const totalText = `${t.total}${t.skips ? '*' : ''}${course.par ? ` (${formatPar(t.vsPar)})` : ''}`;
    return `<section class="now editing" data-action="stop-edit" aria-live="polite">
          <div class="meta"><span>${esc(course.name)} · hole ${hole} / ${course.holes}</span>${par !== null ? `<span>Par ${par}</span>` : ''}</div>
          <div class="who">Editing ${esc(nameOf(playerId))} · Hole ${hole}</div>
          <div class="meta"><span>Total ${totalText}</span><span>Current ${esc(valueLabel(was))}</span></div>
          <div class="meta next"><span>tap this bar or the cell again to cancel</span></div>
        </section>`;
  }

  function viewScoring() {
    const game = Golf.getActiveGame(state);
    const cur = Golf.cursor(game);
    const course = Golf.getCourse(game.courses[cur.courseIndex].courseId);
    // While editing, the numpad and dock take the edited player's color.
    const player = Golf.getPlayer(state, editing ? editing.playerId : cur.playerId);
    const t = Golf.courseTotal(game, cur.courseIndex, cur.playerId);
    const prior = priorLabel(Golf.priorHoleInfo(game, cur));
    const nextId = Golf.upNext(game, cur);
    const par = course.par ? course.par[cur.hole - 1] : null;
    const totalText = `${t.total}${t.skips ? '*' : ''}${course.par ? ` (${formatPar(t.vsPar)})` : ''}`;
    const keys = course.keys.map((k) => `<button class="key" data-key="${k}">${k}</button>`).join('')
      + '<button class="key s" data-key="S" aria-label="Skip">S</button>';
    const banner = Golf.hasAnyScore(game) ? '' : `<div class="banner-first">
        <span>🎲 ${esc(Golf.firstOrderSentence(state, game))}</span>
        <button class="link" data-action="reroll">Re-roll</button>
      </div>`;
    const cards = game.courses.map((_, ci) => renderCard(game, ci, cur)).join('');
    const bar = editing ? editBar(game) : `<section class="now" aria-live="polite">
          <div class="meta"><span>${esc(course.name)} · hole ${cur.hole} / ${course.holes}</span>${par !== null ? `<span>Par ${par}</span>` : ''}</div>
          <div class="who">${esc(player.name)} is up</div>
          <div class="meta"><span>Total ${totalText}</span><span>${esc(prior)}</span></div>
          ${nextId ? `<div class="meta next"><span>next: ${esc(nameOf(nextId))}</span></div>` : ''}
        </section>`;
    return `
      <div class="scoring" style="--pc:${player.color};--pi:${inkFor(player.color)}">
        ${banner}
        ${bar}
        ${cards}
        <div id="dock" class="dock">
          ${menuOpen ? '<div class="menu"><button class="btn small" data-action="home">Home</button></div>' : ''}
          <div class="pad">${keys}</div>
          <div class="tools">
            <button class="tool" data-action="undo" ${Golf.canUndo(state, game.id) ? '' : 'disabled'}>↶ Undo</button>
            <button class="tool" data-action="redo" ${Golf.canRedo(state, game.id) ? '' : 'disabled'}>Redo ↷</button>
            <button class="tool menu-btn" data-action="menu" aria-expanded="${menuOpen}" aria-label="More">⋯</button>
          </div>
        </div>
      </div>`;
  }

  function viewOver() {
    const game = Golf.getGame(state, state.currentGameId);
    if (!game) return '';
    const sections = game.courses.map((entry, ci) => {
      const course = Golf.getCourse(entry.courseId);
      const r = Golf.courseResult(game, ci);
      let verdict = 'No winner (skips)';
      if (r.winnerId) verdict = `${esc(nameOf(r.winnerId))} wins`;
      else if (r.tied) verdict = 'Tied for first';
      const rows = Golf.standings(game, ci).map((id) => {
        const t = Golf.courseTotal(game, ci, id);
        const crown = id === r.winnerId ? ' 👑' : '';
        const par = course.par ? ` (${formatPar(t.vsPar)})` : '';
        return `<li class="row"><span class="pname">${esc(nameOf(id))}${crown}</span><span>${t.total}${t.skips ? '*' : ''}${par}</span></li>`;
      }).join('');
      return `<section class="card"><h2>${esc(course.name)}</h2><p class="hint">${verdict}</p><ul class="list">${rows}</ul></section>`;
    }).join('');
    return `
      <header class="top"><h1>Game over</h1></header>
      ${sections}
      <button class="btn big primary" data-action="home">Home</button>`;
  }

  const VIEWS = { setup: viewSetup, home: viewHome, scoring: viewScoring, over: viewOver };

  // The numpad sits over the page, so the page gets padding equal to its height.
  function sizeDock() {
    const dock = $('#dock');
    if (dock) document.documentElement.style.setProperty('--dock-h', `${dock.offsetHeight}px`);
  }

  // Scrolls so the cursor cell sits between the now-up bar and the numpad.
  function scrollToCursor() {
    const cell = document.querySelector('.scoring td.cur');
    const bar = document.querySelector('.scoring .now');
    const dock = $('#dock');
    if (!cell || !bar || !dock) return;
    const top = bar.getBoundingClientRect().bottom + 8;
    const bottom = dock.getBoundingClientRect().top - 8;
    const r = cell.getBoundingClientRect();
    if (r.top >= top && r.bottom <= bottom) return;
    window.scrollBy(0, (r.top + r.bottom) / 2 - (top + bottom) / 2);
  }

  function render() {
    const app = $('#app');
    if (blockedMessage) {
      releaseAwake();
      app.innerHTML = `<section class="card">
        <h2>Can't open saved data</h2>
        <p>${esc(blockedMessage)}</p>
        <p class="hint">Nothing has been changed. Your saved data is untouched.</p>
      </section>`;
      return;
    }
    if (screen === 'scoring' && !Golf.getActiveGame(state)) {
      const current = Golf.getGame(state, state.currentGameId);
      screen = current && current.status === 'finished' ? 'over' : 'home';
    }
    if (editing && !editTargetOk()) editing = null;
    document.body.classList.toggle('scoring', screen === 'scoring');
    app.innerHTML = VIEWS[screen]();
    if (screen === 'setup' && editingId) {
      const input = app.querySelector('.rename input');
      if (input) { input.focus(); input.select(); }
    }
    if (screen === 'scoring') {
      sizeDock();
      keepAwake();
      if (scrollPending) {
        scrollPending = false;
        scrollToCursor();
      }
    } else {
      releaseAwake();
    }
  }

  // ---- actions ---------------------------------------------------------------

  function startNewGame() {
    if (Golf.rosterPlayers(state).length === 0) { go('setup'); return; }
    if (Golf.getActiveGame(state) && !confirm('Abandon current game?')) return;
    try {
      commit(Golf.newGame(state, cryptoRand, nowISO()), 'scoring');
    } catch (e) {
      toast(e.message);
    }
  }

  function reroll() {
    const game = Golf.getActiveGame(state);
    if (!game) return;
    try {
      commit(Golf.rerollFirstOrder(state, game.id, cryptoRand));
    } catch (e) {
      toast(e.message);
    }
  }

  // True while the edited cell still exists and holds a value in the active game.
  function editTargetOk() {
    const game = Golf.getActiveGame(state);
    if (!game || screen !== 'scoring' || !editing) return false;
    const row = game.courses[editing.courseIndex] && game.courses[editing.courseIndex].scores[editing.playerId];
    return Array.isArray(row) && row[editing.hole - 1] !== null && row[editing.hole - 1] !== undefined;
  }

  // One numpad tap (pointer, keyboard digit, or S). Records the score at the cursor,
  // or overwrites the edited cell while in edit mode.
  function press(value) {
    if (screen !== 'scoring') return;
    const game = Golf.getActiveGame(state);
    const cur = game ? Golf.cursor(game) : null;
    if (!cur) return;
    if (Date.now() - lastScoreAt < FAT_FINGER_MS) return;
    const target = editing || cur;
    const course = Golf.getCourse(game.courses[target.courseIndex].courseId);
    if (value !== 'S' && !course.keys.includes(value)) return;
    let next;
    try {
      next = editing
        ? Golf.editScore(state, game.id, editing.courseIndex, editing.hole, editing.playerId, value)
        : Golf.recordScore(state, game.id, value, nowISO());
    } catch (e) {
      toast(e.message);
      return;
    }
    lastScoreAt = Date.now();
    navigator.vibrate?.(10);
    if (editing) {
      const message = `${nameOf(editing.playerId)} · Hole ${editing.hole} → ${valueLabel(value)}`;
      editing = null;
      menuOpen = false;
      commit(next);
      toast(message);
      return;
    }
    const after = Golf.getGame(next, game.id);
    const justFinished = !Golf.courseFilled(game, cur.courseIndex) && Golf.courseFilled(after, cur.courseIndex);
    const message = justFinished
      ? courseMessage(after, cur.courseIndex)
      : `${nameOf(cur.playerId)} · ${value === 'S' ? 'skip' : value} ✓`;
    menuOpen = false;
    scrollPending = after.status === 'active';
    commit(next, after.status === 'finished' ? 'over' : null);
    toast(message);
  }

  function keyValue(el) {
    return el.dataset.key === 'S' ? 'S' : Number(el.dataset.key);
  }

  // Undo or redo the last action. The toast names the score that was undone or redone.
  function step(kind) {
    const game = Golf.getGame(state, state.currentGameId);
    if (!game) return;
    const stack = kind === 'undo' ? game.undo : game.redo;
    const action = stack[stack.length - 1];
    if (!action) return;
    let next;
    try {
      next = kind === 'undo' ? Golf.undo(state, game.id) : Golf.redo(state, game.id, nowISO());
    } catch (e) {
      toast(e.message);
      return;
    }
    const after = Golf.getGame(next, game.id);
    editing = null;
    menuOpen = false;
    scrollPending = true;
    commit(next, after.status === 'finished' ? 'over' : 'scoring');
    toast(`${kind === 'undo' ? 'Undid' : 'Redid'} ${nameOf(action.playerId)} · ${valueLabel(action.next)}`);
  }

  // Tapping a filled cell starts editing it, and tapping the same cell again cancels.
  // Empty cells do nothing.
  function tapCell(el) {
    const game = Golf.getActiveGame(state);
    if (!game) return;
    const target = { courseIndex: Number(el.dataset.ci), hole: Number(el.dataset.h), playerId: el.dataset.pid };
    if (game.courses[target.courseIndex].scores[target.playerId][target.hole - 1] === null) return;
    const same = !!editing && editing.courseIndex === target.courseIndex
      && editing.hole === target.hole && editing.playerId === target.playerId;
    editing = same ? null : target;
    render();
  }

  function toggleCard(ci) {
    const game = Golf.getActiveGame(state) || Golf.getGame(state, state.currentGameId);
    if (!game) return;
    const status = courseStatus(game, ci, Golf.cursor(game));
    overrides.set(ci, { status, open: !cardOpen(ci, status) });
    render();
  }

  function toggleRoster(id, checked) {
    const others = state.lastRoster.filter((x) => x !== id);
    try {
      commit(Golf.setRoster(state, checked ? [...others, id] : others));
    } catch (e) {
      setupError = e.message;
      render();
    }
  }

  function addPlayerFromForm(name) {
    try {
      let next = Golf.addPlayer(state, name, cryptoRand, nowISO());
      const newId = next.players[next.players.length - 1].id;
      if (state.lastRoster.length < Golf.MAX_ROSTER) {
        next = Golf.setRoster(next, [...state.lastRoster, newId]);
      }
      commit(next);
      const input = $('#app .add input');
      if (input) input.focus();
    } catch (e) {
      setupError = e.message;
      render();
    }
  }

  function renamePlayer(id, name) {
    try {
      const next = Golf.renamePlayer(state, id, name);
      editingId = null;
      commit(next);
    } catch (e) {
      setupError = e.message;
      render();
    }
  }

  function removePlayer(id) {
    const player = Golf.getPlayer(state, id);
    if (!player || !confirm(`Remove ${player.name}? Past games keep their scores.`)) return;
    if (editingId === id) editingId = null;
    commit(Golf.hidePlayer(state, id));
  }

  // ---- events (delegated) ----------------------------------------------------

  // Taps score on pointerdown for an instant response.
  document.addEventListener('pointerdown', (event) => {
    const key = event.target.closest?.('[data-key]');
    if (!key) return;
    lastPointerAt = Date.now();
    press(keyValue(key));
  });

  document.addEventListener('click', (event) => {
    const key = event.target.closest?.('[data-key]');
    if (key) {
      // Keyboard activation (Enter or Space) is a click with detail 0 and no recent pointer press.
      if (event.detail === 0 && Date.now() - lastPointerAt > POINTER_WINDOW_MS) press(keyValue(key));
      return;
    }
    const cell = event.target.closest?.('td[data-cell]');
    if (cell) { tapCell(cell); return; }
    const el = event.target.closest('[data-action]');
    if (!el) return;
    const { action, id } = el.dataset;
    switch (action) {
      case 'home': editingId = null; go('home'); break;
      case 'players': editingId = null; go('setup'); break;
      case 'new':
      case 'start': startNewGame(); break;
      case 'resume': go('scoring'); break;
      case 'reroll': reroll(); break;
      case 'undo': step('undo'); break;
      case 'redo': step('redo'); break;
      case 'stop-edit': editing = null; render(); break;
      case 'toggle-card': toggleCard(Number(el.dataset.ci)); break;
      case 'menu': menuOpen = !menuOpen; render(); break;
      case 'edit': editingId = id; setupError = ''; render(); break;
      case 'cancel-edit': editingId = null; render(); break;
      case 'remove': removePlayer(id); break;
      case 'export': toast('Export is not built yet.'); break;
      case 'soon': toast('Coming in a later step.'); break;
      default: break; // 'toggle' is handled by the change listener
    }
  });

  document.addEventListener('change', (event) => {
    const el = event.target;
    if (el.matches('[data-action="toggle"]')) toggleRoster(el.dataset.id, el.checked);
  });

  document.addEventListener('submit', (event) => {
    event.preventDefault();
    const form = event.target;
    const name = String(new FormData(form).get('name') || '');
    if (form.dataset.form === 'add') addPlayerFromForm(name);
    if (form.dataset.form === 'rename') renamePlayer(form.dataset.id, name);
  });

  // Desktop testing: digits 1-8 and S.
  document.addEventListener('keydown', (event) => {
    if (screen !== 'scoring' || event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.target.closest?.('input, textarea, select')) return;
    const key = event.key.toLowerCase();
    if (key === 's') {
      event.preventDefault();
      press('S');
    } else if (/^[1-8]$/.test(key)) {
      press(Number(key));
    }
  });

  // Phones drop the wake lock when the page is hidden, so take it again on return.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && screen === 'scoring') keepAwake();
  });

  window.addEventListener('resize', sizeDock);

  // Another tab changed storage: reload state so the last writer does not win silently.
  window.addEventListener('storage', (event) => {
    if (event.key !== null && event.key !== STORAGE_KEY) return;
    state = loadState();
    render();
  });

  // ---- init ------------------------------------------------------------------

  state = loadState();
  const current = Golf.getGame(state, state.currentGameId);
  if (Golf.visiblePlayers(state).length === 0) {
    screen = 'setup';
  } else {
    screen = current && current.status === 'finished' ? 'over' : 'home';
  }
  render();
})();
</script>
</body>
</html>
