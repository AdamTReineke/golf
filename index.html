      // Refused here (for example on an insecure page). The older method is tried next.
    }
    if (legacyCopy(text)) {
      toast('Copied ✓');
      return 'copied';
    }
    showCopyModal(text);
    return 'modal';
  }

  // ---- export and import helpers (spec 9.2, 9.3) ------------------------------

  const exportJson = (now) => JSON.stringify(Golf.exportEnvelope(state, now), null, 2);

  // golf-scorecard-YYYY-MM-DD.json, dated in the local calendar.
  function exportFilename(iso) {
    const d = new Date(iso);
    const two = (n) => String(n).padStart(2, '0');
    return `golf-scorecard-${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())}.json`;

  function lastExportLine() {
    const days = Golf.daysSince(state.lastExportAt, nowISO());
    if (days === null) return 'Never exported';
    if (days === 0) return 'Last export: today';
    if (days === 1) return 'Last export: 1 day ago';
    return `Last export: ${days} days ago`;
  }

  function downloadJson() {
    const now = nowISO();
    const url = URL.createObjectURL(new Blob([exportJson(now)], { type: 'application/json' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = exportFilename(now);
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    commit(Golf.markExported(state, now));
    toast('Downloaded ✓');
  }

  async function copyJson() {
    const now = nowISO();
    if (await copyText(exportJson(now)) === 'copied') commit(Golf.markExported(state, now));
  }

  // The mailto link navigates by itself, so this only records the export without a re-render.
  function markExportedQuietly() {
    state = Golf.markExported(state, nowISO());
    writeState(state);
  }

  // The corrupt-data backup to offer, if the user has not dismissed it (spec 12).
  function corruptBackupKey() {
    let best = null;
    try {
      for (let i = 0; i < localStorage.length; i += 1) {
        const key = localStorage.key(i);
        if (key && key.startsWith(CORRUPT_PREFIX)) {
          const ts = Number(key.slice(CORRUPT_PREFIX.length));

      return null;

  function copyCorrupt(key) {
    let raw = null;
    try {
      raw = localStorage.getItem(key);

      return;

    copyText(raw);

  // Shown on iOS Safari outside the Home Screen app, until dismissed (spec 11).
  function iosHintWanted() {
    if (iosHintHidden) return false;
    const ua = navigator.userAgent || '';

      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  async function applyImport() {
    const preview = importPreview;

    const { summary } = preview;
    let next;
    try {
      if (importMode === 'replace') {
        if (!confirm('Replace all data on this device with the file? Your current data is copied to the clipboard first.')) return;
        const now = nowISO();

        next = Golf.markExported(incoming, now);

  // ---- toast and save banner -------------------------------------------------

  function toast(message) {

      localStorage.setItem(key, raw);

  // ---- scoring helpers -------------------------------------------------------

  // 'todo' (no cell entered), 'active' (partly entered), 'done' (every cell filled).
  function courseStatus(game, ci, cur) {
    const entry = game.courses[ci];
    const started = game.playerIds.some((id) => entry.scores[id].some((v) => v !== null));

    return Golf.courseFilled(game, ci) ? 'done' : 'active';

  function cardOpen(ci, status) {
    if (status === 'todo') return false;
    const ov = overrides.get(ci);
    if (ov && ov.status === status) return ov.open;
    return status === 'active';
  }

  function priorLabel(prior) {
    if (!prior) return '';
    if (prior.kind === 'hole') return `${prior.label}: ${prior.score === null ? '–' : prior.score}`;
    return `${prior.label}: ${prior.total}${prior.skips ? '*' : ''}`;
  }

  // Toast text when a course is finished or its playoff starts or ends. Uses the stored
  // state, so the next course is known.
  function courseMessage(game, ci) {
    const course = Golf.getCourse(game.courses[ci].courseId);
    const r = Golf.courseResult(game, ci);
    const ps = Golf.playoffState(game, ci);
    if (ps.needed && !ps.winnerId) {
      return `${course.name}: tie! Playoff: ${ps.participants.map(nameOf).join(' vs ')}`;
    }
    const nextEntry = game.courses[ci + 1];
    const nextName = nextEntry ? Golf.getCourse(nextEntry.courseId).name : null;
    let core;
    if (r.decidedBy === 'playoff') {
      core = `${nameOf(r.winnerId)} wins the ${course.name} playoff on P${r.decidedOn}`;
    } else if (r.winnerId) {
      const skipped = game.playerIds
        .filter((id) => r.skips[id] > 0)
        .map((id) => `${nameOf(id)} has ${r.skips[id]} skip${r.skips[id] > 1 ? 's' : ''}`);

        core = `${course.name}: ${nameOf(r.winnerId)} leads (${skipped.join(', ')})`;
      } else {
        const gap = r.runnerUpTotal !== null ? ` – ${r.runnerUpTotal}` : '';
        core = `${course.name}: ${nameOf(r.winnerId)} wins, ${r.total}${gap}`;
      }

      core = `${course.name}: no winner (skips)`;

    return nextName ? `${core}. ${nextName} next` : core;
  }

  // The toast after one numpad tap in scoring (not editing).
  function pressMessage(before, after, cur, value) {
    const ci = cur.courseIndex;
    const label = `${nameOf(cur.playerId)} · ${value === 'S' ? 'skip' : value} ✓`;
    if (cur.playoff) {
      const decided = Golf.playoffState(after, ci);
      if (decided.winnerId && !Golf.playoffState(before, ci).winnerId) return courseMessage(after, ci);
      return label;
    }
    const justFinished = !Golf.courseFilled(before, ci) && Golf.courseFilled(after, ci);
    const tieNow = !Golf.playoffState(before, ci).needed && Golf.playoffState(after, ci).needed;
    return justFinished || tieNow ? courseMessage(after, ci) : label;
  }

  function summary(game) {
    const cur = Golf.cursor(game);
    const phase = Golf.gamePhase(game);

    if (cur) {
      const course = Golf.getCourse(game.courses[cur.courseIndex].courseId);
      where = cur.playoff ? `${course.name} playoff P${cur.pIndex + 1}` : `${course.name}, hole ${cur.hole}`;
    } else if (phase === 'skipDecision') {
      where = 'skips to decide';
    } else if (phase === 'review') {

    if (game.startedAt) parts.push(`started ${formatTime(game.startedAt)}`);
    return parts.join(' · ');

    const resume = active
      ? `<button class="btn big primary" data-action="resume">Resume game<span class="sub">${esc(summary(active))}</span></button>`
      : '';
    return `
      <header class="top"><h1>Golf Scorecard</h1></header>
      ${corruptNotice()}
      ${iosHintWanted() ? '<div class="ios-hint" role="note"><span>Tip: Share → Add to Home Screen keeps your scores safe</span><button class="link" data-action="dismiss-ios">Dismiss</button></div>' : ''}
      ${resume}
      <button class="btn ${active ? '' : 'big primary'}" data-action="new">New game</button>
      <button class="playing" data-action="players"><span>${playingLine}</span><span aria-hidden="true">›</span></button>
      <nav class="links">
        <button class="link" data-action="history">History</button>
        <button class="link" data-action="players">Players</button>
        <button class="link" data-action="export-screen">Export all data</button>
        <button class="link" data-action="import-screen">Import data</button>
      </nav>
      <p class="last-export">${lastExportLine()}</p>`;
  }

  // Offers the raw text of unreadable saved data, moved aside by recoverCorrupt (spec 12).
  function corruptNotice() {
    const key = corruptBackupKey();
    if (!key) return '';
    return `<section class="notice" role="status">
        <p>Saved data could not be read, so it was moved to <code>${esc(key)}</code>. Nothing was deleted.</p>
        <div class="notice-actions">
          <button class="btn small" data-action="copy-corrupt" data-backup="${esc(key)}">Copy raw data</button>
          <button class="link" data-action="dismiss-corrupt">Dismiss</button>
        </div>
      </section>`;
  }

  // ---- venue picker and location (spec 2) -----------------------------------

  // The venue the next game starts at: the nearby one until the user picks, then the saved pick.
  function selectedVenueId() {
    if (nearby && !venueTouched) return nearby.venue.id;
    const playable = Golf.playableVenues();
    return playable.some((v) => v.id === state.lastVenueId) ? state.lastVenueId : playable[0].id;
  }

  // Asks for the position once per visit to setup. Never blocks: on error, denial or no
  // nearby venue nothing changes.
  function locateVenue() {
    const request = ++venueRequest;
    nearby = null;
    venueTouched = false;
    if (Golf.playableVenues().length < 2 || !window.isSecureContext || !navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((pos) => {
      if (request !== venueRequest || screen !== 'setup' || venueTouched) return;
      nearby = Golf.nearestVenue({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      updateVenuePicker();
    }, () => {}, { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
  }

  // Syncs the picker and hint in place, so text typed in the add-player box survives.
  function updateVenuePicker() {
    const selected = selectedVenueId();
    document.querySelectorAll('input[name="venue"]').forEach((r) => { r.checked = r.value === selected; });
    const hint = document.querySelector('#venue-hint');
    if (!hint) return;
    const show = !!nearby && !venueTouched;
    hint.hidden = !show;
    hint.textContent = show ? `📍 You're at ${nearby.venue.name}` : '';
  }

  // Radio list of venues, shown only when there is more than one (spec 2).
  function venuePicker() {
    const selected = selectedVenueId();
    const show = !!nearby && !venueTouched;
    const options = Golf.playableVenues().map((v) => `<label class="choice"><input type="radio" name="venue" value="${esc(v.id)}" ${v.id === selected ? 'checked' : ''}><span>${esc(v.name)}${v.address ? ` <span class="hint">${esc(v.address)}</span>` : ''}</span></label>`).join('');
    return `<p class="section-label">Venue</p>
      <div role="radiogroup" aria-label="Venue">${options}</div>
      <p class="hint" id="venue-hint"${show ? '' : ' hidden'}>${show ? `📍 You're at ${esc(nearby.venue.name)}` : ''}</p>`;
  }

  function viewSetup() {
    const roster = new Set(state.lastRoster);
    const full = roster.size >= Golf.MAX_ROSTER;
    const active = Golf.getActiveGame(state);
    const players = Golf.visiblePlayers(state);
    const rows = players.map((p) => {
      const id = esc(p.id);
      if (editingId === p.id) {
        return `<li class="row">
          <form class="rename" data-form="rename" data-id="${id}">
            <input class="text" name="name" maxlength="24" value="${esc(p.name)}" aria-label="New name">
            <button class="btn small primary">Save</button>
            <button type="button" class="btn small" data-action="cancel-edit">Cancel</button>
          </form>
        </li>`;
      }
      const checked = roster.has(p.id);
      const disabled = !checked && full ? 'disabled' : '';
      return `<li class="row">
        <label class="pick">
          <input type="checkbox" data-action="toggle" data-id="${id}" ${checked ? 'checked' : ''} ${disabled}>
          <span class="dot" style="background:${esc(p.color)}"></span>
          <span class="pname">${esc(p.name)}</span>
        </label>
        <button class="link" data-action="edit" data-id="${id}">Rename</button>
        <button class="link danger" data-action="remove" data-id="${id}">Remove</button>
      </li>`;
    }).join('');
    return `
      ${corruptNotice()}
      <header class="top"><button class="link" data-action="home">&larr; Home</button><h1>Players</h1></header>
      <form class="add" data-form="add">
        <input class="text" name="name" maxlength="24" placeholder="Add a player" autocomplete="off" autocapitalize="words" aria-label="Player name">
        <button class="btn primary">Add</button>
      </form>
      ${setupError ? `<p class="error" role="alert">${esc(setupError)}</p>` : ''}
      <p class="section-label">Playing today: ${roster.size} of ${Golf.MAX_ROSTER}</p>
      <ul class="list">${rows}</ul>
      ${players.length ? '' : '<p class="hint">No players yet. Add the people playing today.</p>'}
      ${Golf.playableVenues().length > 1 ? venuePicker() : ''}
      <button class="btn big primary" data-action="start" ${roster.size < Golf.MIN_ROSTER ? 'disabled' : ''}>${active ? 'Start new game' : 'Start game'}</button>
      <p class="hint">Starting a game shuffles the hole 1 order.</p>`;
  }

  // Ref for Golf.cellValue from the UI's editing state.
  const cellRef = (e) => (e.pIndex === null
    ? { courseIndex: e.courseIndex, hole: e.hole, playerId: e.playerId }
    : {
      courseIndex: e.courseIndex, hole: e.hole, playerId: e.playerId, playoff: true, pIndex: e.pIndex,
    });

  // Playoff rows for course ci, one per playoff hole that has started (spec 7.1). A
  // player out of the playoff, or eliminated on that hole, is greyed out.
  function playoffRows(game, ci, cur, ps) {
    return ps.rounds.map((round) => {
      const label = `P${round.pIndex + 1} · h${round.hole}`;
      const cells = game.playerIds.map((id) => {
        if (!round.order.includes(id)) return '<td class="out"></td>';
        const v = Golf.cellValue(game, {
          courseIndex: ci, hole: round.hole, playerId: id, playoff: true, pIndex: round.pIndex,
        });
        const isCur = !!cur && cur.playoff && cur.courseIndex === ci && cur.pIndex === round.pIndex && cur.playerId === id;
        const isEdit = !!editing && editing.courseIndex === ci && editing.pIndex === round.pIndex && editing.playerId === id;
        const out = round.eliminated.includes(id) ? 'out' : '';
        const cls = [isCur ? 'cur' : '', isEdit ? 'editing' : '', out].filter(Boolean).join(' ');
        const attrs = v === null ? '' : ` data-cell data-ci="${ci}" data-h="${round.hole}" data-pid="${esc(id)}" data-po="${round.pIndex}"`;
        return `<td class="${cls}"${attrs}>${v === null ? '' : esc(v)}</td>`;
      }).join('');
      return `<tr class="po"><th scope="row">${label}</th>${cells}</tr>`;
    }).join('');
  }

  // readOnly (an abandoned game in history): no cursor, every started card is open, nothing to tap.
  function renderCard(game, ci, cur, readOnly = false) {
    const entry = game.courses[ci];
    const course = Golf.getCourse(entry.courseId);
    const status = courseStatus(game, ci, cur);
    const parTotal = course.par ? course.par.reduce((a, b) => a + b, 0) : null;
    const meta = parTotal !== null ? `par ${parTotal}` : `${course.holes} holes`;
    const inner = `<span>${esc(course.name)}</span><span>${meta}</span>`;
    if (status === 'todo') {
      return `<section class="course todo"><div class="course-head static">${inner}</div></section>`;
    }
    const here = !!cur && cur.courseIndex === ci;
    // The regular cursor on this course (not a playoff entry).
    const regHere = here && !cur.playoff;
    // A playoff or replay on this course keeps its card open.
    const open = readOnly || (here && (cur.playoff || cur.replay)) || cardOpen(ci, status);
    const order = regHere && !cur.replay ? Golf.turnOrder(game, ci, cur.hole) : null;
    const head = readOnly
      ? `<div class="course-head static">${inner}</div>`
      : `<button class="course-head" data-action="toggle-card" data-ci="${ci}" aria-expanded="${open}">${inner}</button>`;
    const names = game.playerIds.map((id) => {
      const badge = order ? `<span class="badge">${order.indexOf(id) + 1}</span>` : '';
      return `<th scope="col">${badge}<span class="pn">${esc(nameOf(id))}</span></th>`;
    }).join('');
    let body = '';
    if (open) {
      for (let h = 1; h <= course.holes; h += 1) {
        const isNow = regHere && cur.hole === h;
        const cells = game.playerIds.map((id) => {
          const v = entry.scores[id][h - 1];
          const isCur = isNow && cur.playerId === id;
          const isEdit = !!editing && editing.pIndex === null && editing.courseIndex === ci
            && editing.hole === h && editing.playerId === id;
          const cls = [isCur ? 'cur' : '', isEdit ? 'editing' : ''].filter(Boolean).join(' ');
          const cellAttrs = v === null ? '' : ` data-cell data-ci="${ci}" data-h="${h}" data-pid="${esc(id)}"`;
          return `<td class="${cls}"${cellAttrs}>${v === null ? '' : esc(v)}</td>`;
        }).join('');
        body += `<tr class="${isNow ? 'now-row' : ''}"><th scope="row">${h}</th>${cells}</tr>`;
      }
    }
    const totals = game.playerIds.map((id) => {
      const t = Golf.courseTotal(game, ci, id);
      return `<td>${t.total}${t.skips ? '*' : ''}</td>`;
    }).join('');
    const ps = Golf.playoffState(game, ci);
    const po = ps.needed ? playoffRows(game, ci, cur, ps) : '';
    return `<section class="course ${status}">${head}
      <table class="sheet">
        <thead><tr><th scope="col">#</th>${names}</tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr><th scope="row">Tot</th>${totals}</tr>${po}</tfoot>
      </table>
    </section>`;
  }

  // The bar in edit mode (spec 6.4): amber, names the cell, and tapping it cancels.
  function editBar(game) {
    const { courseIndex: ci, hole, playerId, pIndex } = editing;
    const course = Golf.getCourse(game.courses[ci].courseId);
    const t = Golf.courseTotal(game, ci, playerId);
    const was = Golf.cellValue(game, cellRef(editing));
    const isPo = pIndex !== null;
    const par = !isPo && course.par ? course.par[hole - 1] : null;
    const totalText = `${t.total}${t.skips ? '*' : ''}${course.par ? ` (${formatPar(t.vsPar)})` : ''}`;
    const where = isPo
      ? `Playoff · ${course.name} hole ${hole} (P${pIndex + 1})`
      : `${course.name} · hole ${hole} / ${course.holes}`;
    const who = isPo ? `Editing ${esc(nameOf(playerId))}` : `Editing ${esc(nameOf(playerId))} · Hole ${hole}`;
    return `<section class="now editing${isPo ? ' playoff' : ''}" data-action="stop-edit" aria-live="polite">
          <div class="meta"><span>${esc(where)}</span>${par !== null ? `<span>Par ${par}</span>` : ''}</div>
          <div class="who">${who}</div>
          <div class="meta"><span>Total ${totalText}</span><span>Current ${esc(valueLabel(was))}</span></div>
          <div class="meta next"><span>tap this bar or the cell again to cancel</span></div>
        </section>`;
  }

  // The now-up bar for a regulation cell.
  // The last line of the bar. Tap confirmations replace its text for a moment (see toast).
  function flashLine(text) {
    const shown = text || ' ';
    return `<div class="meta next"><span data-flash data-next="${esc(text)}">${esc(shown)}</span></div>`;
  }

  function regularBar(game, cur) {
    const course = Golf.getCourse(game.courses[cur.courseIndex].courseId);
    const player = Golf.getPlayer(state, cur.playerId);
    const t = Golf.courseTotal(game, cur.courseIndex, cur.playerId);
    const prior = priorLabel(Golf.priorHoleInfo(game, cur));
    const nextId = Golf.upNext(game, cur);
    const par = course.par ? course.par[cur.hole - 1] : null;
    const totalText = `${t.total}${t.skips ? '*' : ''}${course.par ? ` (${formatPar(t.vsPar)})` : ''}`;
    return `<section class="now" aria-live="polite">
          <div class="meta"><span>${esc(course.name)} · hole ${cur.hole} / ${course.holes}</span>${par !== null ? `<span>Par ${par}</span>` : ''}</div>
          <div class="who">${esc(player.name)} is up</div>
          <div class="meta"><span>Total ${totalText}</span><span>${esc(prior)}</span></div>
          ${flashLine(nextId ? `next: ${nameOf(nextId)}` : '')}
        </section>`;
  }

  // Replay (spec 7.2): "Replay · Adam · Mini Golf hole 4".
  function replayBar(game, cur) {
    const course = Golf.getCourse(game.courses[cur.courseIndex].courseId);
    const player = Golf.getPlayer(state, cur.playerId);
    const t = Golf.courseTotal(game, cur.courseIndex, cur.playerId);
    const prior = priorLabel(Golf.priorHoleInfo(game, cur));
    const totalText = `${t.total}${t.skips ? '*' : ''}${course.par ? ` (${formatPar(t.vsPar)})` : ''}`;
    return `<section class="now" aria-live="polite">
          <div class="meta"><span>Replay · ${esc(player.name)} · ${esc(course.name)} hole ${cur.hole}</span></div>
          <div class="who">${esc(player.name)} is up</div>
          <div class="meta"><span>Total ${totalText}</span><span>${esc(prior)}</span></div>
          ${flashLine('')}
        </section>`;
  }

  // Playoff (spec 7.1): purple, "Playoff · Mini Golf hole 1 (P1)" above "<Name> is up".
  function playoffBar(game, cur) {
    const course = Golf.getCourse(game.courses[cur.courseIndex].courseId);
    const player = Golf.getPlayer(state, cur.playerId);
    const t = Golf.courseTotal(game, cur.courseIndex, cur.playerId);
    const totalText = `${t.total}${t.skips ? '*' : ''}${course.par ? ` (${formatPar(t.vsPar)})` : ''}`;
    const k = cur.pIndex;
    const prev = k > 0
      ? `P${k}: ${valueLabel(Golf.cellValue(game, { courseIndex: cur.courseIndex, hole: cur.hole, playerId: cur.playerId, playoff: true, pIndex: k - 1 }))}`
      : 'Playoff starts';
    const nextId = Golf.upNext(game, cur);
    return `<section class="now playoff" aria-live="polite">
          <div class="meta"><span>Playoff · ${esc(course.name)} hole ${cur.hole} (P${k + 1})</span></div>
          <div class="who">${esc(player.name)} is up</div>
          <div class="meta"><span>Total ${totalText}</span><span>${esc(prev)}</span></div>
          ${flashLine(nextId ? `next: ${nameOf(nextId)}` : '')}
        </section>`;
  }

  // Everything is scored: tapping the bar finishes a reopened game (spec 7.2 / 7).
  function reviewBar() {
    return `<section class="now review" data-action="finish-game" role="button" tabindex="0" aria-live="polite">
          <div class="meta"><span>All scored · Finish</span></div>
          <div class="who">Finish game</div>
          <div class="meta next"><span>tap to finish · tap any cell to change it</span></div>
        </section>`;
  }

  // The skip decision (spec 7.2): replaces the numpad.
  function skipSheet(game) {
    const skipped = Golf.regulationSkips(game);
    const lines = game.playerIds.map((id) => {
      const parts = skipped.filter((c) => c.playerId === id).map((c) => {
        const name = Golf.getCourse(game.courses[c.courseIndex].courseId).name;
        return `${name} ${c.hole}`;
      });
      return parts.length ? `<li><strong>${esc(nameOf(id))}</strong>: ${esc(parts.join(', '))}</li>` : '';
    }).join('');
    return `<div class="skip-sheet" role="dialog" aria-label="Skipped holes">
        <h2>Skipped holes</h2>
        <ul class="skip-list">${lines}</ul>
        <button class="btn big primary" data-action="replay-skips">Replay skipped holes</button>
        <button class="btn big" data-action="finish-anyway">Finish anyway</button>
      </div>`;
  }

  function viewScoring() {
    const game = Golf.getActiveGame(state);
    const cur = Golf.cursor(game);
    const phase = Golf.gamePhase(game);
    // The player whose color the bar and numpad take: the edited cell's, else the cursor's.
    const colorId = editing ? editing.playerId : (cur ? cur.playerId : null);
    const player = colorId ? Golf.getPlayer(state, colorId) : null;
    const style = player
      ? `--pc:${player.color};--pi:${inkFor(player.color)}`
      : '--pc:var(--accent);--pi:var(--accent-fg)';
    const keys = cur || editing
      ? Golf.getCourse(game.courses[(editing || cur).courseIndex].courseId).keys
        .map((k) => `<button class="key" data-key="${k}">${k}</button>`).join('')
        + '<button class="key s" data-key="S" aria-label="Skip">S</button>'
      : '';
    const banner = Golf.hasAnyScore(game) ? '' : `<div class="banner-first">
        <span>🎲 ${esc(Golf.firstOrderSentence(state, game))}</span>
        <button class="link" data-action="reroll">Re-roll</button>
      </div>`;
    const cards = game.courses.map((_, ci) => renderCard(game, ci, cur)).join('');
    let bar;
    if (editing) bar = editBar(game);
    else if (phase === 'review') bar = reviewBar();
    else if (phase === 'skipDecision') {
      bar = `<section class="now neutral"><div class="meta"><span>All holes scored</span></div>
          <div class="who">Skipped holes</div>
          <div class="meta next"><span>choose below</span></div></section>`;
    } else if (phase === 'replay') bar = replayBar(game, cur);
    else if (phase === 'playoff') bar = playoffBar(game, cur);
    else bar = regularBar(game, cur);
    const pad = phase === 'skipDecision'
      ? skipSheet(game)
      : `<div class="pad">${keys}</div>`;
    return `
      <div class="scoring" style="${style}">
        ${banner}
        ${bar}
        ${cards}
        <div id="dock" class="dock">
          ${menuOpen ? '<div class="menu"><button class="btn small" data-action="copy-scores">Copy scores</button><button class="btn small" data-action="end-early">End game early</button><button class="btn small" data-action="home">Home</button></div>' : ''}
          ${pad}
          <div class="tools">
            <button class="tool" data-action="undo" ${Golf.canUndo(state, game.id) ? '' : 'disabled'}>↶ Undo</button>
            <button class="tool" data-action="redo" ${Golf.canRedo(state, game.id) ? '' : 'disabled'}>Redo ↷</button>
            <button class="tool menu-btn" data-action="menu" aria-expanded="${menuOpen}" aria-label="More">⋯</button>
          </div>
        </div>
      </div>`;
  }

  const ordinal = (n) => {
    if (n === 1) return 'best';
    const suffix = ['th', 'st', 'nd', 'rd'];
    const v = n % 100;
    return `${n}${suffix[(v - 20) % 10] || suffix[v] || suffix[0]} best`;
  };
  const joinNames = (names) => (names.length <= 2
    ? names.join(' and ')
    : `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`);
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const formatDate = (iso) => {
    try {
      return `${new Date(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })} · ${formatTime(iso)}`;
    } catch (e) {
      return '';
    }
  };

  // The stats screen only shows a game that is finished.
  function statsGame() {
    const game = Golf.getGame(state, viewGameId || state.currentGameId);
    return game && game.status === 'finished' ? game : null;
  }

  function hasNewRecord(game) {
    return Golf.gameStats(state, game.id).courses.some((c) => c.standings
      .some((r) => r.record && r.record.kind === 'new'));
  }

  // Session summary (spec 8.2): the day's champion(s) and all-time head-to-head.
  function sessionCard(game, stats) {
    const wins = (id) => stats.wins[id];
    let headline;
    if (stats.champions.length === 0) {
      headline = 'No course winners yet';
    } else if (stats.champions.length === 1) {
      const champ = stats.champions[0];
      const runnerUp = Math.max(0, ...game.playerIds.filter((id) => id !== champ).map(wins));
      headline = `🏆 ${esc(nameOf(champ))} wins the day, ${plural(wins(champ), 'course')}`
        + ` to ${runnerUp}`;
    } else {
      const names = stats.champions.map((id) => esc(nameOf(id)));
      headline = `🏆 Co-champions: ${joinNames(names)}, ${wins(stats.champions[0]) === 1 ? '1 course' : `${wins(stats.champions[0])} courses`} each`;
    }
    const tally = game.playerIds.map((id) => `${esc(nameOf(id))} ${wins(id)}`).join(' · ');
    const pairs = stats.headToHead
      .filter((p) => p.aWins + p.bWins > 0)
      .map((p) => `<li>${esc(nameOf(p.a))} vs ${esc(nameOf(p.b))}: ${p.aWins}–${p.bWins} in course wins</li>`)
      .join('');
    return `<section class="card stats-head">
        <p class="champ">${headline}</p>
        <p class="hint">Course wins today: ${tally}</p>
        ${pairs ? `<p class="hint">All-time head to head</p><ul class="highlights">${pairs}</ul>` : ''}
      </section>`;
  }

  // One player's line on a course card: total, record, and percentiles (spec 8.1).
  function standingBlock(game, course, c, row) {
    const crown = row.playerId === c.winnerId ? ' 👑' : '';
    const total = `${row.total}${row.complete ? '' : '*'}`;
    const par = course.par ? ` (${formatPar(row.vsPar)})` : '';
    const lines = [];
    if (row.record && row.record.kind === 'new') {
      lines.push(`<p class="record">🎉 New personal record! ${row.total} (was ${row.record.previousBest})</p>`);
    } else if (row.record && row.record.kind === 'first') {
      lines.push('<p class="quiet">First round, record set</p>');
    } else if (row.record && row.record.kind === 'tied') {
      lines.push('<p class="quiet">Tied your best</p>');
    }
    if (row.complete) {
      if (row.pctAll !== null) {
        lines.push(`<p class="note">Better than ${row.pctAll}% of all ${esc(course.name)} rounds</p>`);
      }
      if (row.pctPersonal !== null) {
        const rank = row.rank === 1 ? `your best of ${row.ofCount}` : `your ${ordinal(row.rank)} of ${row.ofCount}`;
        lines.push(`<p class="note">Better than ${row.pctPersonal}% of your rounds · ${rank}</p>`);
      } else {
        lines.push(`<p class="note">Round ${row.priorCount + 1} on record, percentiles start at ${Golf.MIN_POOL}</p>`);
      }
    }
    return `<li class="standing">
        <div class="top-line"><span>${esc(nameOf(row.playerId))}${crown}</span><span>${total}${par}</span></div>
        ${lines.join('')}
      </li>`;
  }

  // One course card on the stats screen (spec 8.1).
  function courseStatsCard(game, c) {
    const course = Golf.getCourse(c.courseId);
    if (!c.played) {
      return `<section class="card"><h2>${esc(c.name)}</h2><p class="hint">Not played</p></section>`;
    }
    const r = Golf.courseResult(game, c.courseIndex);
    let verdict = game.endedEarly ? 'Not finished' : 'No winner (skips)';
    if (c.winnerId) verdict = `${esc(nameOf(c.winnerId))} wins`;
    else if (r.tied) verdict = 'Tied for first';
    if (c.decidedBy === 'playoff') verdict += ` · won in a playoff on P${c.decidedOn}`;
    const rows = c.standings.map((row) => standingBlock(game, course, c, row)).join('');
    const highlights = [];
    if (course.par) {
      const ones = c.standings.filter((row) => row.holesInOne > 0)
        .map((row) => `${esc(nameOf(row.playerId))} ${row.holesInOne}`);
      if (ones.length) highlights.push(`<li>🎯 Holes-in-one: ${ones.join(', ')}</li>`);
    }
    if (c.hardestHole) {
      highlights.push(`<li>🧗 Hardest hole: ${c.hardestHole.hole} (average ${c.hardestHole.avg.toFixed(1)})</li>`);
    }
    const best = c.bestHoles[0];
    if (best) {
      highlights.push(`<li>⭐ Best hole: ${esc(nameOf(best.playerId))} on ${best.hole}`
        + ` (${best.score} vs group ${best.avg.toFixed(1)})</li>`);
    }
    return `<section class="card">
        <h2>${esc(c.name)}</h2>
        <p class="hint">${verdict}</p>
        <ul class="list-reset">${rows}</ul>
        ${highlights.length ? `<ul class="highlights">${highlights.join('')}</ul>` : ''}
      </section>`;
  }

  // Stats (spec 8): one scrollable screen. Reopen only for the latest finished game when
  // no game is in progress.
  function viewStats() {
    const game = statsGame();
    if (!game) return '';
    const stats = Golf.gameStats(state, game.id);
    const latest = Golf.latestFinishedGameId(state) === game.id && !Golf.getActiveGame(state);
    const back = backScreen === 'history' ? '<button class="link" data-action="history">&larr; History</button>'
      : '<button class="link" data-action="home">&larr; Home</button>';
    const note = game.endedEarly ? '<p class="hint">Ended early. Holes that were not scored are blank.</p>' : '';
    return `
      <header class="top">${back}<h1>Game stats</h1></header>
      <p class="hint">${esc(formatDate(game.startedAt))}${game.playerIds.length ? ` · ${game.playerIds.map((id) => esc(nameOf(id))).join(', ')}` : ''}</p>
      ${sessionCard(game, stats)}
      ${note}
      ${stats.courses.map((c) => courseStatsCard(game, c)).join('')}
      <div class="actions">
        <button class="btn big" data-action="copy-scores">Copy scores</button>
        ${latest ? '<button class="btn big" data-action="reopen">Reopen game</button>' : ''}
        <button class="btn big primary" data-action="home">Home</button>
      </div>`;
  }

  // An abandoned game, read-only (spec 8.3). Abandoned games are not in stats.
  function viewAbandoned() {
    const game = Golf.getGame(state, viewGameId);
    if (!game) return '';
    const cards = game.courses.map((_, ci) => renderCard(game, ci, null, true)).join('');
    const names = game.playerIds.map((id) => esc(nameOf(id))).join(', ');
    return `
      <header class="top"><button class="link" data-action="history">&larr; History</button><h1>Abandoned</h1></header>
      <p class="hint">${esc(formatDate(game.startedAt))} · ${names}. Abandoned games are left out of stats.</p>
      ${cards}`;
  }

  // History (spec 8.3): finished and abandoned games, newest first, and per-player history.
  function gamesList() {
    const games = Golf.listGames(state).filter((g) => g.status === 'finished' || g.status === 'abandoned');
    if (games.length === 0) return '<p class="hint">No finished games yet.</p>';
    return games.map((g) => {
      const names = g.playerIds.map((id) => esc(nameOf(id))).join(', ');
      if (g.status === 'abandoned') {
        return `<button class="game-row abandoned" data-action="open-abandoned" data-id="${esc(g.id)}">
            <span>${esc(formatDate(g.startedAt))} · Abandoned</span>
            <span class="sub-line">${names}</span>
          </button>`;
      }
      const wins = g.winners.map((w) => `${esc(Golf.getCourse(w.courseId).name)}: ${esc(nameOf(w.winnerId))}`);
      return `<button class="game-row" data-action="open-stats" data-id="${esc(g.id)}">
          <span>${esc(formatDate(g.startedAt))}${g.endedEarly ? ' · ended early' : ''}</span>
          <span class="sub-line">${names}</span>
          <span class="sub-line">${wins.length ? wins.join(' · ') : 'No course winners'}</span>
        </button>`;
    }).join('');
  }

  // A tiny trend line of the last totals. Lower is better, so lower totals plot higher.
  function sparkline(values) {
    const w = 72;
    const h = 24;
    const pad = 3;
    const lo = Math.min(...values);
    const hi = Math.max(...values);
    const x = (i) => (values.length === 1 ? w / 2 : pad + (i * (w - 2 * pad)) / (values.length - 1));
    const y = (v) => (hi === lo ? h / 2 : pad + ((v - lo) / (hi - lo)) * (h - 2 * pad));
    const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const last = values.length - 1;
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Last totals: ${values.join(', ')}">
        <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${x(last).toFixed(1)}" cy="${y(values[last]).toFixed(1)}" r="2.5" fill="currentColor"/>
      </svg>`;
  }

  function playersList() {
    const players = Golf.visiblePlayers(state);
    if (players.length === 0) return '<p class="hint">No players yet. Add them under Players on Home.</p>';
    return players.map((p) => {
      const rows = Golf.playerHistory(state, p.id).filter((r) => r.rounds > 0);
      const body = rows.length
        ? rows.map((r) => `<div class="prow">
            <div>
              <strong>${esc(r.name)}</strong>
              <div class="sub-line">${plural(r.rounds, 'round')} · best ${r.best} · average ${r.average.toFixed(1)}</div>
            </div>
            ${sparkline(r.last5)}
          </div>`).join('')
        : '<p class="hint">No finished rounds yet.</p>';
      return `<section class="card"><h2><span class="dot" style="background:${esc(p.color)}"></span>${esc(p.name)}</h2>${body}</section>`;
    }).join('');
  }

  function viewHistory() {
    const tab = (name, label) => `<button class="tab" role="tab" aria-selected="${historyTab === name}" data-action="history-tab" data-tab="${name}">${label}</button>`;
    return `
      <header class="top"><button class="link" data-action="home">&larr; Home</button><h1>History</h1></header>
      <div class="tabs" role="tablist">${tab('games', 'Games')}${tab('players', 'Players')}</div>
      ${historyTab === 'games' ? gamesList() : playersList()}`;
  }

  // Export all data (spec 9.2): copy is the main path; download and mailto are the others.
  function viewExport() {
    const now = nowISO();
    const json = exportJson(now);
    const kb = Math.max(1, Math.round(json.length / 1024));
    const subject = encodeURIComponent(`Golf Scorecard backup, ${exportFilename(now)}`);
    const mail = `mailto:?subject=${subject}&body=${encodeURIComponent(json)}`;
    return `
      <header class="top"><button class="link" data-action="home">&larr; Home</button><h1>Export</h1></header>
      <p>Your scores live only on this device. Keep a copy somewhere safe, so you can move them or restore them later.</p>
      <p class="hint">${plural(state.players.length, 'player')}, ${plural(state.games.length, 'game')} · about ${kb} KB</p>
      <div class="actions">
        <button class="btn big primary" data-action="copy-json">Copy JSON<span class="sub">Recommended. Paste it into a note or a message.</span></button>
        <button class="btn big" data-action="download-json">Download .json<span class="sub">${esc(exportFilename(now))}</span></button>
        <a class="btn big" href="${esc(mail)}" data-action="email-json">Email it<span class="sub">Long emails can be cut short, so copy is safer.</span></a>
      </div>
      <p class="last-export">${lastExportLine()}</p>`;
  }

  // Import (spec 9.3): paste or pick a file, preview it, then merge or replace.
  function viewImport() {
    const result = importPreview;
    let resultHtml = '';
    if (result && !result.ok) {
      resultHtml = `<p class="error" role="alert">${esc(result.error)}</p>`;
    } else if (result && result.ok) {
      const when = result.exportedAt && Golf.dayLabel(result.exportedAt)
        ? `<p class="hint">Exported ${esc(Golf.dayLabel(result.exportedAt))}</p>` : '';
      const replace = importMode === 'replace';
      resultHtml = `<section class="card" id="import-result">
          <h2>Preview</h2>
          <p class="champ">${plural(result.summary.players, 'player')}, ${plural(result.summary.games, 'game')}</p>
          ${when}
          <fieldset class="mode">
            <legend>When importing</legend>
            <label class="choice"><input type="radio" name="import-mode" value="merge" ${replace ? '' : 'checked'}><span>Merge. Adds what this device does not have. Nothing is removed.</span></label>
            <label class="choice"><input type="radio" name="import-mode" value="replace" ${replace ? 'checked' : ''}><span>Replace. This device's data is swapped for the file's.</span></label>
          </fieldset>
          ${replace ? '<p class="hint">Your current data is copied to the clipboard first.</p>' : ''}
          <button class="btn big primary" data-action="import-apply">${replace ? 'Replace my data' : 'Merge into this device'}</button>
        </section>`;
    }
    return `
      <header class="top"><button class="link" data-action="home">&larr; Home</button><h1>Import</h1></header>
      <p>Paste an export, or choose its .json file. Nothing changes until you import it.</p>
      <label class="section-label" for="import-text">Export JSON</label>
      <textarea id="import-text" class="import-text" rows="8" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Paste the exported JSON here">${esc(importText)}</textarea>
      <div class="import-actions">
        <label class="btn small" for="import-file">Choose a .json file</label>
        <input id="import-file" class="sr-only" type="file" accept=".json,application/json">
        <button class="btn small primary" data-action="import-preview">Preview</button>
      </div>
      ${resultHtml}`;
  }

  const VIEWS = {
    setup: viewSetup, home: viewHome, scoring: viewScoring, stats: viewStats, history: viewHistory, abandoned: viewAbandoned,
    export: viewExport, import: viewImport,
  };

  // Copies the scores of the game on screen, or the current game (spec 9.1).
  function copyScores() {
    const game = Golf.getGame(state, viewGameId || state.currentGameId);
    if (!game) return;
    menuOpen = false;
    render();
    copyText(Golf.scoresText(state, game.id));
  }

  // The numpad sits over the page, so the page gets padding equal to its height.
  // The sticky names row of each card sits just under the now-up bar, so --bar-h is the
  // bar's height (the names row is pinned using it in CSS).
  function sizeDock() {
    const dock = $('#dock');
    if (dock) document.documentElement.style.setProperty('--dock-h', `${dock.offsetHeight}px`);
    const bar = document.querySelector('.scoring .now');
    if (bar) document.documentElement.style.setProperty('--bar-h', `${bar.offsetHeight}px`);
  }

  // Scrolls so the cursor cell sits between the pinned bar and names row and the numpad.
  function scrollToCursor() {
    const cell = document.querySelector('.scoring td.cur');
    const bar = document.querySelector('.scoring .now');
    const dock = $('#dock');
    if (!cell || !bar || !dock) return;
    const head = cell.closest('table') ? cell.closest('table').querySelector('thead') : null;
    const top = bar.getBoundingClientRect().bottom + (head ? head.offsetHeight : 0) + 8;
    const bottom = dock.getBoundingClientRect().top - 8;
    const r = cell.getBoundingClientRect();
    if (r.top >= top && r.bottom <= bottom) return;
    window.scrollBy(0, (r.top + r.bottom) / 2 - (top + bottom) / 2);
  }

  function render() {
    const app = $('#app');
    if (blockedMessage) {
      releaseAwake();
      app.innerHTML = `<section class="card">
        <h2>Can't open saved data</h2>
        <p>${esc(blockedMessage)}</p>
        <p class="hint">Nothing has been changed. Your saved data is untouched.</p>
      </section>`;
      return;
    }
    if (screen === 'scoring' && !Golf.getActiveGame(state)) {
      const current = Golf.getGame(state, state.currentGameId);
      screen = current && current.status === 'finished' ? 'stats' : 'home';
      viewGameId = null;
    }
    if (screen === 'stats' && !viewGameId) viewGameId = state.currentGameId;
    if (editing && !editTargetOk()) editing = null;
    document.body.classList.toggle('scoring', screen === 'scoring');
    // The sticky bar height only means something while scoring.
    if (screen !== 'scoring') document.documentElement.style.removeProperty('--bar-h');
    // Confetti belongs to the stats screen. Leaving it must not leave pieces on the next screen.
    if (screen !== renderedScreen) {
      renderedScreen = screen;
      document.querySelectorAll('.confetti-layer').forEach((el) => el.remove());
    }
    app.innerHTML = VIEWS[screen]();
    if (screen === 'setup' && editingId) {
      const input = app.querySelector('.rename input');
      if (input) { input.focus(); input.select(); }
    }
    if (screen === 'scoring') {
      sizeDock();
      keepAwake();
      if (scrollPending) {
        scrollPending = false;
        scrollToCursor();
      }
    } else {
      releaseAwake();
    }
    // Confetti once each time the stats screen opens for a game with a new record.
    if (screen === 'stats') {
      if (statsShownKey !== viewGameId) {
        statsShownKey = viewGameId;
        const game = statsGame();
        if (game && hasNewRecord(game)) confetti();
      }
    } else {
      statsShownKey = null;
    }
  }

  // Confetti (spec 8.1): a few dozen colored pieces fall once, then the layer is removed.
  // Skipped under prefers-reduced-motion.
  function confetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const layer = document.createElement('div');
    layer.className = 'confetti-layer';
    layer.setAttribute('aria-hidden', 'true');
    const colors = [...Golf.PALETTE, '#f5c542', '#ff8fab'];
    for (let i = 0; i < 40; i += 1) {
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.background = colors[i % colors.length];
      piece.style.animationDuration = `${(1.8 + Math.random() * 1.2).toFixed(2)}s`;
      piece.style.animationDelay = `${(Math.random() * 0.4).toFixed(2)}s`;
      piece.style.setProperty('--dx', `${Math.round((Math.random() - 0.5) * 160)}px`);
      piece.style.setProperty('--rot', `${Math.round(360 + Math.random() * 540)}deg`);
      layer.appendChild(piece);
    }
    document.body.appendChild(layer);
    setTimeout(() => layer.remove(), 3000);
  }

  // ---- actions ---------------------------------------------------------------

  function startNewGame() {
    if (Golf.rosterPlayers(state).length === 0) { go('setup'); return; }
    if (Golf.getActiveGame(state) && !confirm('Abandon current game?')) return;
    try {
      const venueId = selectedVenueId();
      commit(Golf.setVenue(Golf.newGame(state, cryptoRand, nowISO(), venueId), venueId), 'scoring');
    } catch (e) {
      toast(e.message);
    }
  }

  function reroll() {
    const game = Golf.getActiveGame(state);
    if (!game) return;
    try {
      commit(Golf.rerollFirstOrder(state, game.id, cryptoRand));
    } catch (e) {
      toast(e.message);
    }
  }

  // True while the edited cell still exists and holds a value in the active game.
  function editTargetOk() {
    const game = Golf.getActiveGame(state);
    if (!game || screen !== 'scoring' || !editing) return false;
    const v = Golf.cellValue(game, cellRef(editing));
    return v !== null && v !== undefined;
  }

  // One numpad tap (pointer, keyboard digit, or S). Records the score at the cursor,
  // or overwrites the edited cell while in edit mode.
  function press(value) {
    if (screen !== 'scoring') return;
    const game = Golf.getActiveGame(state);
    if (!game) return;
    const cur = Golf.cursor(game);
    if (!cur && !editing) {
      toast('Every hole is scored. Tap a cell to change it, or Finish.');
      return;
    }
    if (Date.now() - lastScoreAt < FAT_FINGER_MS) return;
    const target = editing || cur;
    const course = Golf.getCourse(game.courses[target.courseIndex].courseId);
    if (value !== 'S' && !course.keys.includes(value)) return;
    let next;
    try {
      next = editing
        ? Golf.editScore(state, game.id, editing.courseIndex, editing.hole, editing.playerId, value, nowISO(), editing.pIndex)
        : Golf.recordScore(state, game.id, value, nowISO());
    } catch (e) {
      toast(e.message);
      return;
    }
    lastScoreAt = Date.now();
    navigator.vibrate?.(10);
    const after = Golf.getGame(next, game.id);
    if (editing) {
      const where = editing.pIndex === null ? `Hole ${editing.hole}` : `P${editing.pIndex + 1}`;
      const message = `${nameOf(editing.playerId)} · ${where} → ${valueLabel(value)}`;
      editing = null;
      menuOpen = false;
      commit(next, after.status === 'finished' ? 'stats' : null);
      toast(message);
      return;
    }
    const message = pressMessage(game, after, cur, value);
    menuOpen = false;
    scrollPending = after.status === 'active';
    commit(next, after.status === 'finished' ? 'stats' : null);
    toast(message);
  }

  function keyValue(el) {
    return el.dataset.key === 'S' ? 'S' : Number(el.dataset.key);
  }

  // Undo or redo the last action. The toast names the score that was undone or redone.
  function step(kind) {
    const game = Golf.getGame(state, state.currentGameId);
    if (!game) return;
    const stack = kind === 'undo' ? game.undo : game.redo;
    const action = stack[stack.length - 1];
    if (!action) return;
    let next;
    try {
      next = kind === 'undo' ? Golf.undo(state, game.id) : Golf.redo(state, game.id, nowISO());
    } catch (e) {
      toast(e.message);
      return;
    }
    const after = Golf.getGame(next, game.id);
    editing = null;
    menuOpen = false;
    scrollPending = true;
    commit(next, after.status === 'finished' ? 'stats' : 'scoring');
    toast(`${kind === 'undo' ? 'Undid' : 'Redid'} ${nameOf(action.playerId)} · ${valueLabel(action.next)}`);
  }

  // Tapping a filled cell starts editing it, and tapping the same cell again cancels.
  // Empty cells do nothing, and a skipped hole waiting in the replay queue is entered
  // with the numpad during the replay.
  function tapCell(el) {
    const game = Golf.getActiveGame(state);
    if (!game) return;
    const pIndex = el.dataset.po === undefined ? null : Number(el.dataset.po);
    const target = {
      courseIndex: Number(el.dataset.ci), hole: Number(el.dataset.h), playerId: el.dataset.pid, pIndex,
    };
    const v = Golf.cellValue(game, cellRef(target));
    if (v === null || v === undefined) return;
    if (pIndex === null && Golf.replayQueued(game, target.courseIndex, target.hole, target.playerId)) return;
    const same = !!editing && editing.courseIndex === target.courseIndex
      && editing.hole === target.hole && editing.playerId === target.playerId
      && editing.pIndex === target.pIndex;
    editing = same ? null : target;
    render();
  }

  function toggleCard(ci) {
    const game = Golf.getActiveGame(state) || Golf.getGame(state, state.currentGameId);
    if (!game) return;
    const status = courseStatus(game, ci, Golf.cursor(game));
    overrides.set(ci, { status, open: !cardOpen(ci, status) });
    render();
  }

  function toggleRoster(id, checked) {
    const others = state.lastRoster.filter((x) => x !== id);
    try {
      commit(Golf.setRoster(state, checked ? [...others, id] : others));
    } catch (e) {
      setupError = e.message;
      render();
    }
  }

  function addPlayerFromForm(name) {
    try {
      let next = Golf.addPlayer(state, name, cryptoRand, nowISO());
      const newId = next.players[next.players.length - 1].id;
      if (state.lastRoster.length < Golf.MAX_ROSTER) {
        next = Golf.setRoster(next, [...state.lastRoster, newId]);
      }
      commit(next);
      const input = $('#app .add input');
      if (input) input.focus();
    } catch (e) {
      setupError = e.message;
      render();
    }
  }

  function renamePlayer(id, name) {
    try {
      const next = Golf.renamePlayer(state, id, name);
      editingId = null;
      commit(next);
    } catch (e) {
      setupError = e.message;
      render();
    }
  }

  function removePlayer(id) {
    const player = Golf.getPlayer(state, id);
    if (!player || !confirm(`Remove ${player.name}? Past games keep their scores.`)) return;
    if (editingId === id) editingId = null;
    commit(Golf.hidePlayer(state, id));
  }

  // Replay, finish and reopen (spec 7, 7.2). Each one ends in the screen the phase needs.
  function replaySkips() {
    const game = Golf.getActiveGame(state);
    if (!game) return;
    try {
      commit(Golf.startReplay(state, game.id));
    } catch (e) {
      toast(e.message);
    }
  }

  function finishAnyway() {
    const game = Golf.getActiveGame(state);
    if (!game) return;
    try {
      commit(Golf.finishAnyway(state, game.id, nowISO()), 'stats');
    } catch (e) {
      toast(e.message);
    }
  }

  function finishNow() {
    const game = Golf.getActiveGame(state);
    if (!game) return;
    try {
      commit(Golf.finishGame(state, game.id, nowISO()), 'stats');
    } catch (e) {
      toast(e.message);
    }
  }

  function endEarlyNow() {
    const game = Golf.getActiveGame(state);
    if (!game || !confirm('End this game now? Holes that were not scored stay blank.')) return;
    try {
      commit(Golf.endEarly(state, game.id, nowISO()), 'stats');
    } catch (e) {
      toast(e.message);
    }
  }

  function reopenNow() {
    const id = viewGameId || state.currentGameId;
    const others = state.games.some((g) => g.status === 'active' && g.id !== id);
    if (others && !confirm('Another game is in progress. Abandon it and reopen this one?')) return;
    try {
      scrollPending = true;
      commit(Golf.reopenGame(state, id), 'scoring');
    } catch (e) {
      toast(e.message);
    }
  }

  // ---- events (delegated) ----------------------------------------------------

  // Taps score on pointerdown for an instant response.
  document.addEventListener('pointerdown', (event) => {
    const key = event.target.closest?.('[data-key]');
    if (!key) return;
    lastPointerAt = Date.now();
    press(keyValue(key));
  });

  document.addEventListener('click', (event) => {
    const key = event.target.closest?.('[data-key]');
    if (key) {
      // Keyboard activation (Enter or Space) is a click with detail 0 and no recent pointer press.
      if (event.detail === 0 && Date.now() - lastPointerAt > POINTER_WINDOW_MS) press(keyValue(key));
      return;
    }
    const cell = event.target.closest?.('td[data-cell]');
    if (cell) { tapCell(cell); return; }
    const el = event.target.closest('[data-action]');
    if (!el) return;
    const { action, id } = el.dataset;
    switch (action) {
      case 'home': editingId = null; go('home'); break;
      case 'players': editingId = null; go('setup'); break;
      case 'new':
      case 'start': startNewGame(); break;
      case 'resume': go('scoring'); break;
      case 'history': go('history'); break;
      case 'history-tab': historyTab = el.dataset.tab === 'players' ? 'players' : 'games'; render(); break;
      case 'open-stats': go('stats', { gameId: id, back: 'history' }); break;
      case 'open-abandoned': go('abandoned', { gameId: id }); break;
      case 'reroll': reroll(); break;
      case 'undo': step('undo'); break;
      case 'redo': step('redo'); break;
      case 'stop-edit': editing = null; render(); break;
      case 'toggle-card': toggleCard(Number(el.dataset.ci)); break;
      case 'menu': menuOpen = !menuOpen; render(); break;
      case 'end-early': menuOpen = false; endEarlyNow(); break;
      case 'replay-skips': replaySkips(); break;
      case 'finish-anyway': finishAnyway(); break;
      case 'finish-game': finishNow(); break;
      case 'reopen': reopenNow(); break;
      case 'edit': editingId = id; setupError = ''; render(); break;
      case 'cancel-edit': editingId = null; render(); break;
      case 'remove': removePlayer(id); break;
      case 'export': // the save-failure banner
      case 'export-screen': go('export'); break;
      case 'import-screen': go('import'); break;
      case 'copy-json': copyJson(); break;
      case 'download-json': downloadJson(); break;
      case 'email-json': markExportedQuietly(); break;
      case 'import-preview': importPreview = Golf.parseImport(importText); render(); break;
      case 'import-apply': applyImport(); break;
      case 'copy-scores': copyScores(); break;
      case 'copy-corrupt': copyCorrupt(el.dataset.backup); break;
      case 'dismiss-corrupt': corruptDismissed = corruptBackupKey(); render(); break;
      case 'dismiss-ios': dismissIosHint(); break;
      case 'close-copy': document.querySelector('#copy-modal')?.remove(); break;
      default: break; // 'toggle' is handled by the change listener
    }
  });

  document.addEventListener('change', (event) => {
    const el = event.target;
    if (el.matches('[data-action="toggle"]')) toggleRoster(el.dataset.id, el.checked);
    else if (el.name === 'venue') {
      venueTouched = true;
      commit(Golf.setVenue(state, el.value));
    } else if (el.id === 'import-file') readImportFile(el.files && el.files[0]);
    else if (el.name === 'import-mode') {
      importMode = el.value === 'replace' ? 'replace' : 'merge';
      render();
    }
  });

  // Typing in the import box changes what a Preview would read, so an old preview goes away.
  document.addEventListener('input', (event) => {
    if (event.target.id !== 'import-text') return;
    importText = event.target.value;
    if (importPreview) {
      importPreview = null;
      document.querySelector('#import-result')?.remove();
    }
  });

  document.addEventListener('submit', (event) => {
    event.preventDefault();
    const form = event.target;
    const name = String(new FormData(form).get('name') || '');
    if (form.dataset.form === 'add') addPlayerFromForm(name);
    if (form.dataset.form === 'rename') renamePlayer(form.dataset.id, name);
  });

  // Desktop testing: digits 1-8 and S.
  document.addEventListener('keydown', (event) => {
    if (screen !== 'scoring' || event.ctrlKey || event.metaKey || event.altKey) return;
    if (document.querySelector('#copy-modal')) return;
    if (event.target.closest?.('input, textarea, select')) return;
    const key = event.key.toLowerCase();
    if (key === 's') {
      event.preventDefault();
      press('S');
    } else if (/^[1-8]$/.test(key)) {
      press(Number(key));
    }
  });

  // Phones drop the wake lock when the page is hidden, so take it again on return.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && screen === 'scoring') keepAwake();
  });

  window.addEventListener('resize', sizeDock);

  // Another tab changed storage: reload state so the last writer does not win silently.
  window.addEventListener('storage', (event) => {
    if (event.key !== null && event.key !== STORAGE_KEY) return;
    state = loadState();
    render();
  });

  // ---- init ------------------------------------------------------------------

  // Ask the browser to keep this site's storage (spec 11). The answer is not needed.
  try {
    Promise.resolve(navigator.storage?.persist?.()).catch(() => {});
  } catch (e) {
    // Not supported here.
  }

  state = loadState();
  const current = Golf.getGame(state, state.currentGameId);
  if (Golf.visiblePlayers(state).length === 0) {
    screen = 'setup';
  } else {
    screen = current && current.status === 'finished' ? 'stats' : 'home';
  }
  render();
  if (screen === 'setup') locateVenue();
})();
</script>
</body>
</html>
